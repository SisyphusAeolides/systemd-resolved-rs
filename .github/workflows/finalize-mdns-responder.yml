name: Finalize verified mDNS responder

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-mdns-responder.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran iproute2 libssl-dev liburing-dev openssl python3 systemd

      - name: Integrate responder and harden multicast delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          c_path = Path('ffi/mdns.c')
          c = c_path.read_text(encoding='utf-8')
          reuse_port = '''#ifdef SO_REUSEPORT
    if (setsockopt(fd, SOL_SOCKET, SO_REUSEPORT, &enabled, sizeof enabled) < 0 &&
        errno != ENOPROTOOPT)
        goto fail;
#endif
'''
          c = c.replace(reuse_port, '')
          c_path.write_text(c, encoding='utf-8')

          mdns_path = Path('src/mdns.rs')
          mdns = mdns_path.read_text(encoding='utf-8')
          marker = '#[path = "mdns_responder.rs"]\npub mod responder;\n'
          if marker not in mdns:
              if not mdns.endswith('\n'):
                  mdns += '\n'
              mdns += '\n' + marker
          mdns_path.write_text(mdns, encoding='utf-8')

          daemon_path = Path('src/daemon.rs')
          daemon = daemon_path.read_text(encoding='utf-8')
          function = 'pub fn run_stub(resolver: &Arc<Resolver>) -> io::Result<()> {\n'
          start = (
              function
              + '    let mdns_responder = '
              + 'crate::mdns::responder::MdnsResponder::start_from_environment()?;\n'
          )
          if 'MdnsResponder::start_from_environment()?' not in daemon:
              if function not in daemon:
                  raise SystemExit('cannot locate daemon run_stub function')
              daemon = daemon.replace(function, start, 1)
          drop_anchor = '    drop(dispatcher);\n'
          if 'drop(mdns_responder);' not in daemon:
              if drop_anchor not in daemon:
                  raise SystemExit('cannot locate daemon shutdown sequence')
              daemon = daemon.replace(
                  drop_anchor,
                  '    drop(mdns_responder);\n' + drop_anchor,
                  1,
              )
          daemon_path.write_text(daemon, encoding='utf-8')

          preflight_path = Path('scripts/preflight-replacement.sh')
          preflight = preflight_path.read_text(encoding='utf-8')
          run_dir_line = '    "RESOLVED_RS_RUN_DIR=$RUN_DIR" \\\n'
          responder_line = '    "RESOLVED_RS_MDNS_RESPONDER=no" \\\n'
          if responder_line not in preflight:
              if run_dir_line not in preflight:
                  raise SystemExit('cannot locate preflight candidate environment')
              preflight = preflight.replace(
                  run_dir_line,
                  run_dir_line + responder_line,
                  1,
              )
          preflight_path.write_text(preflight, encoding='utf-8')

          live_path = Path('tests/live-mdns.py')
          live = live_path.read_text(encoding='utf-8')
          mdns_line = '                    "RESOLVED_RS_MDNS": "yes",\n'
          responder_entry = '                    "RESOLVED_RS_MDNS_RESPONDER": "no",\n'
          if responder_entry not in live:
              if mdns_line not in live:
                  raise SystemExit('cannot locate live mDNS environment')
              live = live.replace(mdns_line, mdns_line + responder_entry, 1)
          live_path.write_text(live, encoding='utf-8')
          PY

      - name: Verify responder and complete resolver tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/live-mdns.py tests/differential-resolved.py
          bash -n scripts/preflight-replacement.sh
          cargo fmt --all
          make check-native
          make check-packaging
          make check-nss
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked
          python3 tests/live-dns.py \
            target/release/systemd-resolved \
            target/release/resolvectl
          python3 tests/live-mdns.py target/release/systemd-resolved
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          git diff --check

      - name: Commit only the verified responder
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-mdns-responder.yml
          git add -A
          git diff --cached --check
          git commit -m 'Integrate the conflict-aware mDNS responder'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
