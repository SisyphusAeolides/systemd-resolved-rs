name: Export source tree

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=target --exclude=build -czf /tmp/systemd-resolved-rs-source.tar.gz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: systemd-resolved-rs-source
          path: /tmp/systemd-resolved-rs-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Record artifact run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .source-artifact-run
          rm -f .github/workflows/export-source.yml
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Record source export run"
          git push origin HEAD:main
