name: Finalize upstream surface certification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-surface-certification.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize with current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Add strict pinned-surface gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/certify-replacement.sh')
          text = path.read_text(encoding='utf-8')
          gate = '''run_gate upstream-surface-coverage \\
    python3 "$ROOT/scripts/audit-upstream-resolver-surfaces.py" \\
    --output "$ARTIFACT_DIR/upstream-surface-audit.json" \\
    --fail-on-missing
'''
          anchor = '''run_gate upstream-baseline \\
    bash "$ROOT/scripts/verify-upstream-resolved-baseline.sh"
'''
          if 'run_gate upstream-surface-coverage' not in text:
              if anchor not in text:
                  raise SystemExit('cannot locate upstream baseline gate')
              text = text.replace(anchor, anchor + gate, 1)
          if '    "upstream-surface-coverage",\n' not in text:
              expected = '    "upstream-baseline",\n'
              if expected not in text:
                  raise SystemExit('cannot locate upstream baseline expectation')
              text = text.replace(
                  expected,
                  expected + '    "upstream-surface-coverage",\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY
          chmod 0755 scripts/audit-upstream-resolver-surfaces.py
      - name: Validate strict surface gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit-upstream-resolver-surfaces.py
          bash -n scripts/certify-replacement.sh
          scripts/audit-upstream-resolver-surfaces.py --help >/dev/null
          git diff --check
      - name: Commit strict surface coverage requirement
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-surface-certification.yml
          git add -A
          git diff --cached --check
          git commit -m 'Require complete pinned resolver surface coverage'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
