name: Repair shared-memory ABI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-shm-abi.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev

      - name: Apply shared-memory ABI repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/supremacy/shm.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "std::ptr::from_ref(address).cast::<u8>()",
                  "(address as *const ShmAddr).cast::<u8>()",
              ),
              (
                  "std::ptr::from_mut(&mut address).cast::<u8>()",
                  "(&mut address as *mut ShmAddr).cast::<u8>()",
              ),
              (
                  "std::ptr::from_ref(metadata)\n            .cast::<u8>()",
                  "(metadata as *const ShmBucket)\n            .cast::<u8>()",
              ),
              ("0x1000_0000_01b3", "0x0000_0100_0000_01b3"),
              (
                  "ShmPublisher::create_at(&path, 8, 64).unwrap()",
                  "ShmPublisher::create_at(&path, 8, 63).unwrap()",
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"shared-memory repair anchor mismatch: {old!r}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          cargo +stable fmt --all
          cargo +stable clippy --all-targets --all-features --locked -- -D warnings
          cargo +stable test --all-targets --all-features --locked
          make check-nss
          git diff --check

      - name: Verify Rust 1.74
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.74.0 --profile minimal --component rustfmt,clippy
          cargo +1.74.0 fmt --all -- --check
          cargo +1.74.0 clippy --all-targets --all-features --locked -- -D warnings
          cargo +1.74.0 test --all-targets --all-features --locked

      - name: Commit repaired ABI
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-shm-abi.yml
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Repair shared-memory ABI and Rust 1.74 support"
          git push origin HEAD:main
