name: Source snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/source-snapshot.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package tracked source
        shell: bash
        run: git archive --format=tar.gz --output=/tmp/systemd-resolved-rs-source.tar.gz HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: systemd-resolved-rs-source
          path: /tmp/systemd-resolved-rs-source.tar.gz
          if-no-files-found: error
          retention-days: 1
