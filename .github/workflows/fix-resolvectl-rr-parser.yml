name: Fix resolvectl resource record parser

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-resolvectl-rr-parser.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"ci-repair/resolvectl","description":"Resolver module verification in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Repair and canonicalize resolver module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo_path = Path("Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8")
          if "autobins = false" not in cargo:
              anchor = 'build = "build.rs"\n'
              if cargo.count(anchor) != 1:
                  raise SystemExit("Cargo package anchor is missing")
              cargo = cargo.replace(anchor, anchor + "autobins = false\n", 1)
          cargo_path.write_text(cargo, encoding="utf-8")

          path = Path("src/bin/resolvectl_rr.rs")
          text = path.read_text(encoding="utf-8")
          broken = '''        .ok_or_else(|| invalid_data("record is truncated")?
                  .try_into()'''
          fixed = '''        .ok_or_else(|| invalid_data("record is truncated"))?
                  .try_into()'''
          if broken in text:
              text = text.replace(broken, fixed, 1)
          elif fixed not in text:
              raise SystemExit("resolvectl parser repair anchor is missing")

          text = text.replace("use std::collections::BTreeMap;\n", "", 1)
          sha_anchor = "fn sha256(input: &[u8]) -> [u8; 32] {"
          sha_allowed = "#[allow(clippy::too_many_lines)]\n" + sha_anchor
          if sha_allowed not in text:
              if text.count(sha_anchor) != 1:
                  raise SystemExit("SHA-256 implementation anchor is missing")
              text = text.replace(sha_anchor, sha_allowed, 1)

          old_zip = ".zip([a, b, c, d, e, f, g, h].into_iter())"
          new_zip = ".zip([a, b, c, d, e, f, g, h])"
          if old_zip in text:
              text = text.replace(old_zip, new_zip, 1)
          elif new_zip not in text:
              raise SystemExit("SHA-256 state update anchor is missing")

          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          rm -f .github/workflows/fix-resolvectl-rr-parser.yml
          git diff --check

      - name: Verify native and package contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved

      - name: Commit verified repair
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Fix resolvectl resource record module'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Resolver module verification passed' || 'Resolver module verification failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"ci-repair/resolvectl","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
