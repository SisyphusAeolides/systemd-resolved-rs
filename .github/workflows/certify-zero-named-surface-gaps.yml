name: Certify zero named resolver surface gaps

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/certify-zero-named-surface-gaps.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/zero-named-surfaces","description":"Zero named surface certification in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize and remove certification workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/certify-zero-named-surface-gaps.yml

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            agda dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify source and workflow hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'integrate-*' -o -name 'finalize-*' -o -name 'repair-*' -o -name 'analyze-*' -o -name 'certify-*' \) -print)"
          for path in \
            src/varlink_monitor.rs \
            src/varlink_browse.rs \
            src/query_filter.rs \
            src/dnssd_conflict.rs \
            src/log_control.rs \
            src/bin/resolvectl_monitor.rs \
            src/bin/resolvectl_log_control.rs \
            compat/query-filter-upstream.json \
            compat/dnssd-conflicted-upstream.json; do
            test -f "$path"
          done
          cargo fmt --all --check
          git diff --check

      - name: Verify native package NSS and formal contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss
          if make -n check-formal >/dev/null 2>&1; then
            make check-formal
          fi

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts and zero named inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          python3 scripts/audit-upstream-resolver-surfaces.py --output /tmp/upstream-surface-audit.json --fail-on-missing
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/upstream-surface-audit.json").read_text(encoding="utf-8"))
          missing = report["missing"]
          nonempty = {key: value for key, value in missing.items() if value}
          if nonempty:
              raise SystemExit(
                  "named resolver surfaces remain:\n"
                  + json.dumps(nonempty, indent=2, sort_keys=True)
              )

          status_path = Path("compat/current-parity-status.json")
          status = (
              json.loads(status_path.read_text(encoding="utf-8"))
              if status_path.is_file()
              else {"schema": 1}
          )
          status.update(
              {
                  "source_commit": os.environ["GITHUB_SHA"],
                  "pinned_upstream_commit": report["upstream_commit"],
                  "named_missing_total": 0,
                  "remaining": {
                      "dbus": [],
                      "varlink_methods": [],
                      "varlink_errors": [],
                      "configuration_keys": [],
                      "resolvectl_verbs": [],
                  },
                  "named_surface_certification": {
                      "native_abi": "passed",
                      "packaging": "passed",
                      "nss": "passed",
                      "rust_clippy": "passed",
                      "rust_tests": "passed",
                      "release_build": "passed",
                      "live_dns": "passed",
                      "live_dbus": "passed",
                      "pinned_surface_audit": "passed",
                  },
                  "drop_in_certified": False,
                  "drop_in_certification_note": (
                      "Named surface inventory is complete; differential behavior, "
                      "upstream test suites, boot replacement, and rollback remain required."
                  ),
              }
          )
          status_path.write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit zero-gap named surface certificate
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Certify zero named resolver surface gaps'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Zero named surface certification passed' || 'Zero named surface certification failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/zero-named-surfaces","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null