name: Live mDNS responder verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-mdns-responder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Detect integrated responder
        id: integrated
        shell: bash
        run: |
          if grep -Fq '#[path = "mdns_responder.rs"]' src/mdns.rs; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build and namespace tools
        if: ${{ steps.integrated.outputs.value == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran iproute2 libssl-dev liburing-dev

      - name: Build the release daemon
        if: ${{ steps.integrated.outputs.value == 'true' }}
        run: cargo build --release --all-features --locked

      - name: Exercise conflict and response semantics
        if: ${{ steps.integrated.outputs.value == 'true' }}
        shell: bash
        run: python3 tests/live-mdns-responder.py target/release/systemd-resolved

      - name: Explain a staged responder
        if: ${{ steps.integrated.outputs.value != 'true' }}
        run: echo 'The responder is staged but has not passed its atomic integration gate yet.'
