name: Fix and verify reproducible release builder

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-reproducible-release.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize with current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran libssl-dev liburing-dev
      - name: Preserve deterministic hardening flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-reproducible-release.sh')
          text = path.read_text(encoding='utf-8')
          old = '''export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$ROOT=/usr/src/systemd-resolved-rs -C link-arg=-Wl,--build-id=sha1"
export CFLAGS="${CFLAGS:-} -ffile-prefix-map=$ROOT=/usr/src/systemd-resolved-rs -fdebug-prefix-map=$ROOT=/usr/src/systemd-resolved-rs"
export CXXFLAGS="${CXXFLAGS:-} -ffile-prefix-map=$ROOT=/usr/src/systemd-resolved-rs -fdebug-prefix-map=$ROOT=/usr/src/systemd-resolved-rs"
export FFLAGS="${FFLAGS:-} -ffile-prefix-map=$ROOT=/usr/src/systemd-resolved-rs -fdebug-prefix-map=$ROOT=/usr/src/systemd-resolved-rs"
'''
          new = '''export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$ROOT=/usr/src/systemd-resolved-rs -C link-arg=-Wl,--build-id=sha1"
PREFIX_MAP="-ffile-prefix-map=$ROOT=/usr/src/systemd-resolved-rs -fdebug-prefix-map=$ROOT=/usr/src/systemd-resolved-rs"
export CFLAGS="-O2 -g0 -fPIC -std=c17 -Wall -Wextra -Werror -Wpedantic -fstack-protector-strong -D_FORTIFY_SOURCE=3 $PREFIX_MAP"
export CXXFLAGS="-O2 -g0 -fPIC -Wall -Wextra -Werror -fstack-protector-strong -D_FORTIFY_SOURCE=3 $PREFIX_MAP"
export FFLAGS="-O2 -g0 -std=f2018 -Wall -Wextra -Werror -fimplicit-none $PREFIX_MAP"
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'PREFIX_MAP=' not in text:
              raise SystemExit('cannot locate reproducible native flags')
          path.write_text(text, encoding='utf-8')
          PY
          chmod 0755 scripts/build-reproducible-release.sh
      - name: Run the complete reproducibility comparison
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-reproducible-release.sh
          bash scripts/build-reproducible-release.sh
          test -s target/reproducible-release/manifest.json
          git diff --check
      - name: Commit verified builder
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/fix-reproducible-release.yml
          git add -A
          git diff --cached --check
          git commit -m 'Verify hardened reproducible release artifacts'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
