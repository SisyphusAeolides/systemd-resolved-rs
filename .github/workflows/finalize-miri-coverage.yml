name: Finalize strict-provenance Miri coverage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-miri-coverage.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize with current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install native and Miri toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran libssl-dev liburing-dev
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup
      - name: Integrate Miri-only tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tests_path = Path('src/miri_tests.rs')
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '''    let header = wire::Header::parse(&query).expect("header");
    assert_eq!(header.question_count(), 1);
    let question = wire::first_question(&query).expect("question");
    assert_eq!(question.rr_type, wire::TYPE_A);
    assert_eq!(question.name.text(), "example.test");
''',
              '''    let _header = wire::Header::parse(&query).expect("header");
    let _question = wire::first_question(&query).expect("question");
''',
          )
          tests_path.write_text(tests, encoding='utf-8')

          lib_path = Path('src/lib.rs')
          lib = lib_path.read_text(encoding='utf-8')
          marker = '#[cfg(all(test, miri))]\nmod miri_tests;\n'
          if marker not in lib:
              anchor = 'pub const VERSION: &str = env!("CARGO_PKG_VERSION");\n'
              if anchor not in lib:
                  raise SystemExit('cannot locate library version constant')
              lib = lib.replace(anchor, marker + '\n' + anchor, 1)
          lib_path.write_text(lib, encoding='utf-8')

          build_path = Path('build.rs')
          build = build_path.read_text(encoding='utf-8')
          guard = '''    if std::env::var_os("MIRI").is_some()
        || std::env::var_os("CARGO_CFG_MIRI").is_some()
    {
        return;
    }
'''
          if 'std::env::var_os("CARGO_CFG_MIRI")' not in build:
              anchor = 'fn main() {\n'
              if anchor not in build:
                  raise SystemExit('cannot locate build.rs main function')
              build = build.replace(anchor, anchor + guard, 1)
          build_path.write_text(build, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Verify normal build path
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
      - name: Verify Miri strict provenance
        shell: bash
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-disable-isolation
        run: cargo +nightly miri test --lib miri_
      - name: Commit verified Miri coverage
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-miri-coverage.yml
          git add -A
          git diff --cached --check
          git commit -m 'Add strict-provenance Miri parser coverage'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
