name: Integrate live monitor cache snapshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-monitor-cache-snapshots.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/monitor-cache-snapshots","description":"Live monitor cache snapshots in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Export live cache contents
        shell: bash
        run: |
          set -euo pipefail
          cat >> src/cache.rs <<'EOF'

          #[derive(Clone, Debug)]
          pub(crate) struct CacheSnapshotEntry {
              pub(crate) scope: ScopeKind,
              pub(crate) name: String,
              pub(crate) class: u16,
              pub(crate) record_type: u16,
              pub(crate) response: Vec<u8>,
              pub(crate) expires_in: std::time::Duration,
              pub(crate) negative: bool,
          }

          impl Cache {
              pub(crate) fn snapshot(&self) -> Vec<CacheSnapshotEntry> {
                  let now = Instant::now();
                  let mut output: Vec<_> = self
                      .entries
                      .iter()
                      .filter_map(|(key, entry)| {
                          let expires_in = entry.expires_at.checked_duration_since(now)?;
                          Some(CacheSnapshotEntry {
                              scope: key.scope,
                              name: key.name.clone(),
                              class: key.class,
                              record_type: key.record_type,
                              response: entry.response.clone(),
                              expires_in,
                              negative: entry.negative,
                          })
                      })
                      .collect();
                  output.sort_by(|left, right| {
                      (
                          left.scope,
                          left.name.as_str(),
                          left.class,
                          left.record_type,
                      )
                          .cmp(&(
                              right.scope,
                              right.name.as_str(),
                              right.class,
                              right.record_type,
                          ))
                  });
                  output
              }
          }
          EOF

          cat >> src/resolver.rs <<'EOF'

          impl Resolver {
              pub(crate) fn monitor_cache_snapshot(
                  &self,
              ) -> Vec<crate::cache::CacheSnapshotEntry> {
                  self.cache
                      .lock()
                      .unwrap_or_else(std::sync::PoisonError::into_inner)
                      .snapshot()
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/varlink_monitor.rs")
          text = path.read_text(encoding="utf-8")

          def replace_function(source: str, signature: str, replacement: str) -> str:
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              in_string = False
              escaped = False
              index = brace
              while index < len(source):
                  character = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif character == "\\":
                          escaped = True
                      elif character == '"':
                          in_string = False
                  else:
                      if character == '"':
                          in_string = True
                      elif character == "{":
                          depth += 1
                      elif character == "}":
                          depth -= 1
                          if depth == 0:
                              return source[:start] + replacement + source[index + 1 :]
                  index += 1
              raise SystemExit(f"unterminated function: {signature}")

          text = replace_function(
              text,
              "fn monitor_dump_cache(resolver: &Resolver) -> Value {",
              '''fn monitor_dump_cache(resolver: &Resolver) -> Value {
                  let config = resolver.config();
                  let cache = resolver.monitor_cache_snapshot();
                  let mut dump = vec![monitor_scope_cache(
                      crate::routing::ScopeKind::Global,
                      None,
                      None,
                      config.dnssec,
                      config.dns_over_tls,
                      &cache,
                  )];
                  dump.push(monitor_scope_cache(
                      crate::routing::ScopeKind::Fallback,
                      None,
                      None,
                      config.dnssec,
                      config.dns_over_tls,
                      &cache,
                  ));
                  dump.extend(resolver.links().into_iter().map(|link| {
                      monitor_scope_cache(
                          crate::routing::ScopeKind::Link(link.ifindex),
                          Some(&link),
                          link.kernel.as_ref().map(|kernel| kernel.ifname.as_str()),
                          link.dnssec,
                          link.dns_over_tls,
                          &cache,
                      )
                  }));
                  success(Value::object([("dump", Value::Array(dump))]))
              }''',
          )

          text = replace_function(
              text,
              "fn monitor_scope_cache(",
              '''fn monitor_scope_cache(
                  scope: crate::routing::ScopeKind,
                  link: Option<&crate::routing::LinkState>,
                  ifname: Option<&str>,
                  dnssec: crate::config::ValidationMode,
                  dns_over_tls: crate::config::TlsMode,
                  cache: &[crate::cache::CacheSnapshotEntry],
              ) -> Value {
                  Value::object([
                      ("protocol", Value::String("dns".to_owned())),
                      ("family", Value::Null),
                      (
                          "ifindex",
                          link.map_or(Value::Null, |link| {
                              Value::Number(i128::from(link.ifindex))
                          }),
                      ),
                      (
                          "ifname",
                          ifname.map_or(Value::Null, |name| Value::String(name.to_owned())),
                      ),
                      (
                          "cache",
                          Value::Array(
                              cache
                                  .iter()
                                  .filter(|entry| entry.scope == scope)
                                  .map(monitor_cache_entry)
                                  .collect(),
                          ),
                      ),
                      (
                          "dnssec",
                          Value::String(validation_mode_name(dnssec).to_owned()),
                      ),
                      (
                          "dnsOverTLS",
                          Value::String(tls_mode_name(dns_over_tls).to_owned()),
                      ),
                  ])
              }''',
          )

          anchor = "fn monitor_dump_server_state(resolver: &Resolver) -> Value {"
          helpers = r'''fn monitor_cache_entry(entry: &crate::cache::CacheSnapshotEntry) -> Value {
              let rcode = entry.response.get(3).map_or(0, |flags| flags & 0x0f);
              let (rrs, kind) = if entry.negative && rcode != 0 {
                  (
                      Value::Null,
                      Value::String(monitor_cache_rcode_name(rcode).to_owned()),
                  )
              } else {
                  let records = crate::wire::parse_records(&entry.response).unwrap_or_default();
                  let records = records
                      .iter()
                      .filter(|record| {
                          record.name.eq_ignore_ascii_case(&entry.name)
                              && record.class == entry.class
                              && record.record_type == entry.record_type
                      })
                      .map(|record| {
                          Value::object([
                              ("rr", resource_record_to_value(record)),
                              ("raw", Value::String(base64(&record.raw))),
                          ])
                      })
                      .collect();
                  (Value::Array(records), Value::Null)
              };
              let remaining = entry.expires_in.as_micros().min(u128::from(u64::MAX)) as u64;
              let until = native::monotonic_usec().saturating_add(remaining);
              Value::object([
                  (
                      "key",
                      Value::object([
                          ("class", Value::Number(i128::from(entry.class))),
                          ("type", Value::Number(i128::from(entry.record_type))),
                          ("name", Value::String(entry.name.clone())),
                      ]),
                  ),
                  ("rrs", rrs),
                  ("type", kind),
                  ("until", Value::Number(i128::from(until))),
              ])
          }

          const fn monitor_cache_rcode_name(rcode: u8) -> &'static str {
              match rcode {
                  1 => "FORMERR",
                  2 => "SERVFAIL",
                  3 => "NXDOMAIN",
                  4 => "NOTIMP",
                  5 => "REFUSED",
                  _ => "ERROR",
              }
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit("server-state function anchor mismatch")
          text = text.replace(anchor, helpers + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY

          cat >> src/varlink_monitor.rs <<'EOF'

          #[cfg(test)]
          mod live_cache_snapshot_tests {
              use super::*;

              #[test]
              fn negative_cache_snapshot_preserves_key_rcode_and_expiry() {
                  let mut response = vec![0; 12];
                  response[3] = 3;
                  let value = monitor_cache_entry(&crate::cache::CacheSnapshotEntry {
                      scope: crate::routing::ScopeKind::Global,
                      name: "missing.example".to_owned(),
                      class: 1,
                      record_type: 1,
                      response,
                      expires_in: Duration::from_secs(10),
                      negative: true,
                  });
                  assert_eq!(value.get("type").and_then(Value::as_str), Some("NXDOMAIN"));
                  assert_eq!(
                      value
                          .get("key")
                          .and_then(|key| key.get("name"))
                          .and_then(Value::as_str),
                      Some("missing.example")
                  );
                  assert!(value.get("until").and_then(Value::as_u64).is_some());
              }
          }
          EOF

          cat > tests/pinned_monitor_cache_snapshots.rs <<'EOF'
          // SPDX-License-Identifier: LGPL-2.1-or-later
          const CACHE: &str = include_str!("../src/cache.rs");
          const RESOLVER: &str = include_str!("../src/resolver.rs");
          const MONITOR: &str = include_str!("../src/varlink_monitor.rs");

          #[test]
          fn monitor_cache_dump_remains_backed_by_live_cache_entries() {
              for symbol in [
                  "CacheSnapshotEntry",
                  "checked_duration_since",
                  "entry.response.clone",
                  "monitor_cache_snapshot",
                  "crate::wire::parse_records",
                  "resource_record_to_value",
                  "native::monotonic_usec",
                  "monitor_cache_rcode_name",
              ] {
                  assert!(
                      CACHE.contains(symbol)
                          || RESOLVER.contains(symbol)
                          || MONITOR.contains(symbol),
                      "missing live cache export symbol {symbol}"
                  );
              }
          }
          EOF

          rm -f .github/workflows/integrate-monitor-cache-snapshots.yml
          cargo fmt --all
          git diff --check

      - name: Verify native and package contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          python3 scripts/audit-upstream-resolver-surfaces.py --output /tmp/upstream-surface-audit.json

      - name: Commit verified cache tranche
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Export live cache state through Resolve monitor'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Live monitor cache snapshots passed' || 'Live monitor cache snapshots failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/monitor-cache-snapshots","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null