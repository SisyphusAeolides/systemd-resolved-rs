name: Finalize reproducible release certification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-reproducible-certification.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Add reproducibility to the fail-closed certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/certify-replacement.sh')
          text = path.read_text(encoding='utf-8')
          gate = '''run_gate reproducible-release \\
    bash "$ROOT/scripts/build-reproducible-release.sh" \\
    --output "$ARTIFACT_DIR/reproducible-release"
'''
          anchor = '''run_gate release-build \\
    cargo build --manifest-path "$ROOT/Cargo.toml" \\
    --release --all-features --locked
'''
          if 'run_gate reproducible-release' not in text:
              if anchor not in text:
                  raise SystemExit('cannot locate release-build gate')
              text = text.replace(anchor, anchor + gate, 1)
          if '    "reproducible-release",\n' not in text:
              expected = '    "release-build",\n'
              if expected not in text:
                  raise SystemExit('cannot locate expected release gate')
              text = text.replace(
                  expected,
                  expected + '    "reproducible-release",\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY
          chmod 0755 scripts/build-reproducible-release.sh
      - name: Validate release certification tools
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            scripts/build-reproducible-release.sh \
            scripts/certify-replacement.sh
          python3 -m py_compile \
            scripts/import-replacement-proof.py \
            scripts/validate-replacement-proof.py
          scripts/build-reproducible-release.sh --help >/dev/null
          git diff --check
      - name: Commit verified reproducibility gate
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-reproducible-certification.yml
          chmod 0755 \
            scripts/build-reproducible-release.sh \
            scripts/import-replacement-proof.py \
            scripts/validate-replacement-proof.py
          git add -A
          git diff --cached --check
          git commit -m 'Require reproducible artifacts for replacement certification'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
