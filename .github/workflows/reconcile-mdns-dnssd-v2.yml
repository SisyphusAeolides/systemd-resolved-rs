name: Reconcile mDNS and DNS-SD v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-mdns-dnssd-v2.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install complete toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran iproute2 libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.74.0 --profile minimal --component rustfmt,clippy

      - name: Correct recovery-script boundary matching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/reconcile-mdns-dnssd.py')
          text = path.read_text(encoding='utf-8')
          old = r'''        r"    pub fn start_from_environment\([^)]*\) -> io::Result<Option<Self>> \{.*?^    \}\n",
'''
          new = r'''        r"    pub fn start_from_environment\(.*?^    \}\n(?=\}\n\nimpl Drop)",
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '(?=\\}\\n\\nimpl Drop)' not in text:
              raise SystemExit('cannot locate responder constructor regex')
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/reconcile-mdns-dnssd.py

      - name: Reconcile all integration hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile-mdns-dnssd.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mdns_responder.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        append_record(&mut output, record, !legacy, None)?;\n',
              '        append_record(\n'
              '            &mut output,\n'
              '            record,\n'
              '            !legacy,\n'
              '            legacy.then_some(record.ttl.min(LEGACY_UNICAST_TTL_MAX)),\n'
              '        )?;\n',
          )
          old = '''    let ttl = ttl_override.unwrap_or_else(|| {
        if permit_flush {
            record.ttl
        } else {
            record.ttl.min(LEGACY_UNICAST_TTL_MAX)
        }
    });
'''
          new = '''    let ttl = ttl_override.unwrap_or(record.ttl);
'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --binary > /tmp/reconcile-first.patch
          python3 scripts/reconcile-mdns-dnssd.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mdns_responder.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        append_record(&mut output, record, !legacy, None)?;\n',
              '        append_record(\n'
              '            &mut output,\n'
              '            record,\n'
              '            !legacy,\n'
              '            legacy.then_some(record.ttl.min(LEGACY_UNICAST_TTL_MAX)),\n'
              '        )?;\n',
          )
          old = '''    let ttl = ttl_override.unwrap_or_else(|| {
        if permit_flush {
            record.ttl
        } else {
            record.ttl.min(LEGACY_UNICAST_TTL_MAX)
        }
    });
'''
          if old in text:
              text = text.replace(old, '    let ttl = ttl_override.unwrap_or(record.ttl);\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --binary > /tmp/reconcile-second.patch
          cmp /tmp/reconcile-first.patch /tmp/reconcile-second.patch

      - name: Verify native, packaging, and NSS gates
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss
          python3 -m py_compile \
            scripts/reconcile-mdns-dnssd.py \
            tests/differential-resolved.py \
            tests/live-mdns.py \
            tests/live-mdns-responder.py \
            tests/live-dnssd.py
          bash -n \
            scripts/preflight-replacement.sh \
            scripts/certify-replacement.sh \
            scripts/switch-resolved-transactionally.sh \
            scripts/verify-upstream-resolved-baseline.sh

      - name: Verify stable Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --all -- --check
          cargo +stable clippy --all-targets --all-features --locked -- -D warnings
          cargo +stable test --all-targets --all-features --locked
          cargo +stable build --release --all-features --locked

      - name: Verify Rust 1.74
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.74.0 fmt --all -- --check
          cargo +1.74.0 clippy --all-targets --all-features --locked -- -D warnings
          cargo +1.74.0 test --all-targets --all-features --locked
          cargo +1.74.0 build --release --all-features --locked

      - name: Verify every live protocol path
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py \
            target/release/systemd-resolved \
            target/release/resolvectl
          python3 tests/live-mdns.py target/release/systemd-resolved
          python3 tests/live-mdns-responder.py target/release/systemd-resolved
          python3 tests/live-dnssd.py target/release/systemd-resolved
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          if [[ -s compat/upstream-systemd/commit ]]; then
            bash scripts/verify-upstream-resolved-baseline.sh
          fi
          git diff --check

      - name: Commit only the reconciled and verified tree
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-mdns-dnssd.yml
          git rm --force .github/workflows/reconcile-mdns-dnssd-v2.yml
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile and verify the complete multicast DNS stack'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
