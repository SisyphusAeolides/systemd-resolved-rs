name: Finalize DNS-SD Conflicted signal parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-dnssd-conflicted.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/dnssd-conflicted-final","description":"DNS-SD Conflicted final verification in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install build dependencies and pinned source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          if ! test -f compat/dnssd-conflicted-upstream.json; then
            commit=$(cat compat/upstream-systemd/commit)
            git clone --filter=blob:none --no-checkout https://github.com/systemd/systemd.git /tmp/systemd
            git -C /tmp/systemd fetch --depth 1 origin "$commit"
            git -C /tmp/systemd checkout --detach "$commit"
          fi

      - name: Recover and normalize conflict implementation
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f compat/dnssd-conflicted-upstream.json; then
            test -f .github/workflows/analyze-dnssd-conflicted-contract.yml
            python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/analyze-dnssd-conflicted-contract.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          marker = "      - name: Extract signal schema and emission sites"
          cursor = lines.index(marker)
          while lines[cursor] != "        run: |":
              cursor += 1
          cursor += 1
          end = cursor
          while end < len(lines) and not lines[end].startswith("      - name: "):
              end += 1
          body = [line[10:] if line.startswith("          ") else "" for line in lines[cursor:end]]
          Path("/tmp/analyze-conflicted.sh").write_text(
              "\n".join(body) + "\n", encoding="utf-8"
          )
          PY
            bash -n /tmp/analyze-conflicted.sh
            bash /tmp/analyze-conflicted.sh
          fi

          if ! test -f src/dnssd_conflict.rs \
              || ! grep -R -F 'fn conflicted(' src/*.rs >/dev/null 2>&1 \
              || ! grep -R -F 'dnssd_conflict::spawn' src/*.rs >/dev/null 2>&1; then
            test -f .github/workflows/integrate-dnssd-conflicted.yml
            python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/integrate-dnssd-conflicted.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          marker = "      - name: Implement D-Bus signal and registration conflict monitor"
          cursor = lines.index(marker)
          while lines[cursor] != "        run: |":
              cursor += 1
          cursor += 1
          end = cursor
          while end < len(lines) and not lines[end].startswith("      - name: "):
              end += 1
          body = [line[10:] if line.startswith("          ") else "" for line in lines[cursor:end]]
          Path("/tmp/apply-conflicted.sh").write_text(
              "\n".join(body) + "\n", encoding="utf-8"
          )
          PY
            set +e
            bash /tmp/apply-conflicted.sh
            apply_status=$?
            set -e
            test -f src/dnssd_conflict.rs
            printf 'initial conflict integration status: %s\n' "$apply_status"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/dnssd_conflict.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace("    path: PathBuf,\n", "")
          text = re.sub(r"\n\s*path:\s*[^,]+,", "", text)
          text = text.replace(
              "if line.is_empty() || line.starts_with(['#', ';']) {",
              "if line.is_empty() || line.starts_with('#') || line.starts_with(';') {",
          )
          text = text.replace(
              "name: name?,\n                      service_type: service_type?,\n                      domain: domain.unwrap_or_else(|| \"local\".to_owned()),",
              "name: name?.to_ascii_lowercase(),\n                      service_type: service_type?.to_ascii_lowercase(),\n                      domain: domain\n                          .unwrap_or_else(|| \"local\".to_owned())\n                          .to_ascii_lowercase(),",
          )
          path.write_text(text, encoding="utf-8")

          candidates = []
          for source_path in Path("src").glob("*.rs"):
              source = source_path.read_text(encoding="utf-8")
              if "org.freedesktop.resolve1.DnssdService" in source:
                  candidates.append(source_path)
          if len(candidates) != 1:
              raise SystemExit(f"expected one DnssdService source, found {candidates}")
          source_path = candidates[0]
          source = source_path.read_text(encoding="utf-8")
          source = re.sub(
              r"\n\s*#\[dbus_interface\(signal(?:,\s*name\s*=\s*\"Conflicted\")?\)\]\s*"
              r"async\s+fn\s+conflicted\s*\([^;]*?\)\s*->\s*zbus::Result<\(\)>\s*;",
              "",
              source,
              flags=re.S,
          )
          marker = source.index("org.freedesktop.resolve1.DnssdService")
          impl_start = source.index("impl ", marker)
          brace = source.index("{", impl_start)
          depth = 0
          index = brace
          while index < len(source):
              if source[index] == "{":
                  depth += 1
              elif source[index] == "}":
                  depth -= 1
                  if depth == 0:
                      impl_end = index
                      break
              index += 1
          else:
              raise SystemExit("unterminated DnssdService interface impl")
          signal = '''
              #[dbus_interface(signal)]
              async fn conflicted(
                  signal_context: &zbus::SignalContext<'_>,
              ) -> zbus::Result<()>;
          '''
          source = source[:impl_end] + signal + source[impl_end:]
          source_path.write_text(source, encoding="utf-8")

          builders = []
          for source_path in Path("src").glob("*.rs"):
              source = source_path.read_text(encoding="utf-8")
              if "org.freedesktop.resolve1" in source and ".build()" in source and "serve_at" in source:
                  builders.append(source_path)
          if len(builders) != 1:
              raise SystemExit(f"expected one resolved D-Bus builder, found {builders}")
          source_path = builders[0]
          source = source_path.read_text(encoding="utf-8")
          if "dnssd_conflict::spawn" not in source:
              pattern = re.compile(
                  r"let\s+(?P<name>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*(?P<builder>[^;]*?\.build\(\)\.await\?);",
                  re.S,
              )
              matches = [
                  match
                  for match in pattern.finditer(source)
                  if "org.freedesktop.resolve1" in match.group("builder")
              ]
              if len(matches) != 1:
                  raise SystemExit("resolved D-Bus connection binding is missing")
              match = matches[0]
              replacement = match.group(0) + (
                  f"\n    crate::dnssd_conflict::spawn({match.group('name')}.clone());"
              )
              source = source[:match.start()] + replacement + source[match.end():]
              source_path.write_text(source, encoding="utf-8")
          PY

          test -f tests/pinned_dnssd_conflicted.rs
          grep -F 'connection.emit_signal' src/dnssd_conflict.rs >/dev/null
          grep -R -F 'fn conflicted(' src/*.rs >/dev/null
          grep -R -F 'dnssd_conflict::spawn' src/*.rs >/dev/null
          rm -f \
            .github/workflows/analyze-dnssd-conflicted-contract.yml \
            .github/workflows/integrate-dnssd-conflicted.yml \
            .github/workflows/finalize-dnssd-conflicted.yml
          cargo fmt --all
          git diff --check

      - name: Verify native and package contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts and surface reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          python3 scripts/audit-upstream-resolver-surfaces.py --output /tmp/upstream-surface-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/upstream-surface-audit.json").read_text(encoding="utf-8"))
          missing = [item["name"] for item in report["missing"]["dbus"]]
          if "Conflicted" in missing:
              raise SystemExit("DnssdService.Conflicted remains missing")
          PY

      - name: Commit independently verified conflict signal
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Finalize DNS-SD Conflicted signal parity'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'DNS-SD Conflicted final verification passed' || 'DNS-SD Conflicted final verification failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/dnssd-conflicted-final","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null