name: Fix shared-memory test diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-shm-debug.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply and commit fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/supremacy/shm.rs")
          text = path.read_text(encoding="utf-8")
          old = "#[derive(Clone, Copy, Default, PartialEq, Eq)]\npub struct ShmAddr"
          new = "#[derive(Clone, Copy, Debug, Default, PartialEq, Eq)]\npub struct ShmAddr"
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("ShmAddr derive anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/fix-shm-debug.yml
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Derive debug for shared-memory address tests"
          git push origin HEAD:main
