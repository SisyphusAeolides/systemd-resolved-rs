name: Finalize resolved log control parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-log-control.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/log-control-final","description":"resolved log control final verification in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Recover and normalize log control
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f src/log_control.rs \
              || ! test -f src/bin/resolvectl_log_control.rs \
              || ! grep -R -F '/org/freedesktop/LogControl1' src/*.rs >/dev/null 2>&1; then
            test -f .github/workflows/integrate-log-control.yml
            python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/integrate-log-control.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          marker = "      - name: Implement LogControl1 and resolvectl verb"
          try:
              cursor = lines.index(marker)
          except ValueError as error:
              raise SystemExit("log-control implementation step is missing") from error
          while cursor < len(lines) and lines[cursor] != "        run: |":
              cursor += 1
          if cursor == len(lines):
              raise SystemExit("log-control implementation body is missing")
          cursor += 1
          end = cursor
          while end < len(lines) and not lines[end].startswith("      - name: "):
              end += 1
          body = []
          for line in lines[cursor:end]:
              if line.startswith("          "):
                  body.append(line[10:])
              elif not line:
                  body.append("")
              else:
                  raise SystemExit(f"unexpected workflow indentation: {line!r}")
          Path("/tmp/recover-log-control.sh").write_text(
              "\n".join(body) + "\n",
              encoding="utf-8",
          )
          PY
            bash -n /tmp/recover-log-control.sh
            bash /tmp/recover-log-control.sh
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          cargo = Path("Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          dependency_section = re.search(r"(?m)^\[dependencies\]\s*$", text)
          if dependency_section is None:
              raise SystemExit("Cargo dependencies section is missing")
          if re.search(r"(?m)^log\s*=", text) is None:
              next_section = re.search(r"(?m)^\[", text[dependency_section.end():])
              end = (
                  dependency_section.end() + next_section.start()
                  if next_section is not None
                  else len(text)
              )
              text = text[:end].rstrip() + '\nlog = "0.4"\n\n' + text[end:].lstrip()
              cargo.write_text(text, encoding="utf-8")

          control = Path("src/log_control.rs")
          text = control.read_text(encoding="utf-8")
          start = text.index("#[zbus::dbus_interface(name = \"org.freedesktop.LogControl1\")]")
          test_start = text.index("#[cfg(test)]", start)
          implementation = '''#[zbus::dbus_interface(name = "org.freedesktop.LogControl1")]
          impl LogControl {
              #[dbus_interface(property)]
              fn log_level(&self) -> String {
                  crate::log_control::log_level().as_str().to_owned()
              }

              #[dbus_interface(property)]
              fn set_log_level(&mut self, value: &str) -> zbus::fdo::Result<()> {
                  crate::log_control::set_log_level(value)
                      .map(|_| ())
                      .map_err(|error| zbus::fdo::Error::InvalidArgs(error.to_string()))
              }

              #[dbus_interface(property)]
              fn log_target(&self) -> String {
                  LOG_TARGET.to_owned()
              }

              #[dbus_interface(property)]
              fn syslog_identifier(&self) -> String {
                  SYSLOG_IDENTIFIER.to_owned()
              }
          }

          '''
          text = text[:start] + implementation + text[test_start:]
          control.write_text(text, encoding="utf-8")

          candidates = []
          for path in Path("src").glob("*.rs"):
              source = path.read_text(encoding="utf-8")
              if "org.freedesktop.resolve1" in source and ".build()" in source and "serve_at" in source:
                  candidates.append(path)
          if len(candidates) != 1:
              raise SystemExit(f"expected one D-Bus builder, found {candidates}")
          path = candidates[0]
          source = path.read_text(encoding="utf-8")
          if "/org/freedesktop/LogControl1" not in source:
              start = source.index("org.freedesktop.resolve1")
              build = source.index(".build()", start)
              source = source[:build] + '''.serve_at(
                  "/org/freedesktop/LogControl1",
                  crate::log_control::LogControl,
              )?
                  ''' + source[build:]
              path.write_text(source, encoding="utf-8")
          PY

          rm -f \
            .github/workflows/integrate-log-control.yml \
            .github/workflows/finalize-log-control.yml
          cargo fmt --all
          git diff --check

      - name: Verify native and package contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts and surface reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          python3 scripts/audit-upstream-resolver-surfaces.py --output /tmp/upstream-surface-audit.json
          python3 - <<'PY'
          import json

          with open("/tmp/upstream-surface-audit.json", encoding="utf-8") as stream:
              report = json.load(stream)
          if "log-level" in report["missing"]["resolvectl_verbs"]:
              raise SystemExit("resolvectl log-level remains missing")
          PY

      - name: Commit independently verified log control
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Finalize resolved log control parity'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'resolved log control final verification passed' || 'resolved log control final verification failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/log-control-final","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null