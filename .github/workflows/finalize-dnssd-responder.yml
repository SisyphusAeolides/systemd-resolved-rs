name: Finalize DNS-SD responder integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-dnssd-responder.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran iproute2 libssl-dev liburing-dev openssl python3 systemd

      - name: Integrate layered DNS-SD services
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          mdns_path = Path('src/mdns.rs')
          mdns = mdns_path.read_text(encoding='utf-8')
          for marker in (
              '#[path = "dnssd_config.rs"]\npub mod dnssd_config;\n',
              '#[path = "dnssd_runtime.rs"]\npub mod dnssd_runtime;\n',
          ):
              if marker not in mdns:
                  if not mdns.endswith('\n'):
                      mdns += '\n'
                  mdns += '\n' + marker
          mdns_path.write_text(mdns, encoding='utf-8')

          responder_path = Path('src/mdns_responder.rs')
          responder = responder_path.read_text(encoding='utf-8')

          old_generation_check = '''            if state.generation != name.generation {
                state.restart_probe(&name, now);
            }
'''
          new_generation_check = '''            if state.generation != responder_generation(&name) {
                state.restart_probe(&name, now);
            }
'''
          responder = responder.replace(old_generation_check, new_generation_check)
          responder = responder.replace(
              '        self.generation = name.generation;\n',
              '        self.generation = responder_generation(name);\n',
          )
          responder = responder.replace(
              '                        generation: name.generation,\n',
              '                        generation: responder_generation(name),\n',
          )

          conflict_anchor = '''                if detect_conflict(state, &name, &parsed, validated.kind, now) {
'''
          service_conflict = '''                if detect_service_conflict(state, &name, &parsed, validated.kind) {
                    state.restart_probe(&name, now);
                    continue;
                }
                if detect_conflict(state, &name, &parsed, validated.kind, now) {
'''
          if 'detect_service_conflict(state, &name' not in responder:
              if conflict_anchor not in responder:
                  raise SystemExit('cannot locate mDNS conflict dispatch')
              responder = responder.replace(conflict_anchor, service_conflict, 1)

          sort_anchor = '''    output.sort();
    output
}

fn reverse_owner'''
          service_records = '''    match super::dnssd_runtime::records_for(
        interface,
