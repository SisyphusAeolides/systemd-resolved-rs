name: Finalize exact-SHA certification orchestration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-exact-sha-orchestration.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize with current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Normalize proof workflows around explicit source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('.github/workflows/replacement-security-gates.yml'),
              Path('.github/workflows/replacement-security-proof.yml'),
              Path('.github/workflows/replacement-upstream-test-75.yml'),
              Path('.github/workflows/replacement-boot-proof.yml'),
              Path('.github/workflows/replacement-readiness-certificate.yml'),
          ]
          for path in paths:
              if not path.is_file():
                  raise SystemExit(f'missing workflow: {path}')

          def add_dispatch_input(text: str) -> str:
              if re.search(r'^\s{6}source_sha:', text, re.M):
                  return text
              marker = '  workflow_dispatch:\n'
              replacement = '''  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Git commit to execute and prove
        required: false
        type: string
'''
              if marker not in text:
                  raise SystemExit('workflow has no simple workflow_dispatch trigger')
              return text.replace(marker, replacement, 1)

          def add_run_name(text: str, title: str) -> str:
              if re.search(r'^run-name:', text, re.M):
                  return text
              first = text.splitlines()[0]
              if not first.startswith('name: '):
                  raise SystemExit('workflow does not start with name')
              return text.replace(
                  first + '\n',
                  first + f'\nrun-name: {title} ${{{{ inputs.source_sha || github.sha }}}}\n',
                  1,
              )

          def bind_checkouts(text: str) -> str:
              lines = text.splitlines()
              output = []
              index = 0
              expression = '${{ inputs.source_sha || github.sha }}'
              while index < len(lines):
                  line = lines[index]
                  output.append(line)
                  if 'uses: actions/checkout@v4' not in line:
                      index += 1
                      continue
                  indent = line[: len(line) - len(line.lstrip())]
                  next_index = index + 1
                  if next_index < len(lines) and lines[next_index].strip() == 'with:':
                      output.append(lines[next_index])
                      with_indent = lines[next_index][: len(lines[next_index]) - len(lines[next_index].lstrip())]
                      field_indent = with_indent + '  '
                      scan = next_index + 1
                      has_ref = False
                      while scan < len(lines):
                          candidate = lines[scan]
                          if candidate.strip() and len(candidate) - len(candidate.lstrip()) <= len(with_indent):
                              break
                          if candidate.strip().startswith('ref:'):
                              has_ref = True
                          output.append(candidate)
                          scan += 1
                      if not has_ref:
                          output.insert(len(output) - (scan - next_index - 1), field_indent + 'ref: ' + expression)
                      index = scan
                      continue
                  output.append(indent + 'with:')
                  output.append(indent + '  ref: ' + expression)
                  index += 1
              return '\n'.join(output) + '\n'

          titles = {
              'replacement-security-gates.yml': 'Replacement security gates',
              'replacement-security-proof.yml': 'Replacement security proof',
              'replacement-upstream-test-75.yml': 'Replacement upstream TEST-75 proof',
              'replacement-boot-proof.yml': 'Replacement boot and rollback proof',
              'replacement-readiness-certificate.yml': 'Replacement readiness certificate',
          }
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = add_dispatch_input(text)
              text = add_run_name(text, titles[path.name])
              text = bind_checkouts(text)
              text = text.replace(
                  '${{ github.sha }}',
                  '${{ inputs.source_sha || github.sha }}',
              )
              path.write_text(text, encoding='utf-8')

          security_path = Path('.github/workflows/replacement-security-proof.yml')
          security = security_path.read_text(encoding='utf-8')
          security = security.replace(
              '          sha = os.environ["GITHUB_SHA"]\n',
              '          import subprocess\n'
              '          sha = subprocess.check_output(\n'
              '              ["git", "rev-parse", "HEAD"], text=True\n'
              '          ).strip()\n',
              1,
          )
          security_path.write_text(security, encoding='utf-8')

          readiness_path = Path('.github/workflows/replacement-readiness-certificate.yml')
          readiness = readiness_path.read_text(encoding='utf-8')
          old = '''          python3 scripts/download-replacement-proofs.py \\
            --repository "$GITHUB_REPOSITORY" \\
            --sha "$GITHUB_SHA" \\
            --proof-directory target/replacement-proofs
'''
          new = '''          SOURCE_SHA=$(git rev-parse HEAD)
          python3 scripts/download-replacement-proofs.py \\
            --repository "$GITHUB_REPOSITORY" \\
            --sha "$SOURCE_SHA" \\
            --proof-directory target/replacement-proofs
'''
          if old in readiness:
              readiness = readiness.replace(old, new, 1)
          elif '--sha "$SOURCE_SHA"' not in readiness:
              raise SystemExit('cannot bind readiness proof download to checked-out SHA')
          readiness_path.write_text(readiness, encoding='utf-8')
          PY
      - name: Validate workflow structure and orchestration assumptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in (
              'replacement-security-gates.yml',
              'replacement-security-proof.yml',
              'replacement-upstream-test-75.yml',
              'replacement-boot-proof.yml',
              'replacement-readiness-certificate.yml',
              'replacement-full-certification.yml',
          ):
              path = Path('.github/workflows') / name
              text = path.read_text(encoding='utf-8')
              if 'source_sha:' not in text:
                  raise SystemExit(f'{name} has no source_sha input')
              if 'inputs.source_sha || github.sha' not in text:
                  raise SystemExit(f'{name} is not bound to source_sha')
              if not re.search(r'^run-name:.*inputs\.source_sha', text, re.M):
                  raise SystemExit(f'{name} has no SHA-visible run name')
          PY
          git diff --check
      - name: Commit exact-SHA orchestration
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-exact-sha-orchestration.yml
          git add -A
          git diff --cached --check
          git commit -m 'Bind full replacement certification to an exact SHA'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
