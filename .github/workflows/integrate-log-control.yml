name: Integrate resolved log control parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-log-control.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/log-control","description":"resolved log control parity in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Implement LogControl1 and resolvectl verb
        shell: bash
        run: |
          set -euo pipefail
          cat > src/log_control.rs <<'EOF'
          // SPDX-License-Identifier: LGPL-2.1-or-later
          use std::fmt;
          use std::sync::atomic::{AtomicU8, Ordering};

          const LOG_TARGET: &str = "journal-or-kmsg";
          const SYSLOG_IDENTIFIER: &str = "systemd-resolved";
          static LOG_LEVEL: AtomicU8 = AtomicU8::new(LogLevel::Info as u8);

          #[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]
          #[repr(u8)]
          pub enum LogLevel {
              Emerg,
              Alert,
              Crit,
              Err,
              Warning,
              Notice,
              Info,
              Debug,
          }

          impl LogLevel {
              pub fn parse(value: &str) -> Result<Self, LogControlError> {
                  match value.trim().to_ascii_lowercase().as_str() {
                      "0" | "emerg" | "emergency" => Ok(Self::Emerg),
                      "1" | "alert" => Ok(Self::Alert),
                      "2" | "crit" | "critical" => Ok(Self::Crit),
                      "3" | "err" | "error" => Ok(Self::Err),
                      "4" | "warning" | "warn" => Ok(Self::Warning),
                      "5" | "notice" => Ok(Self::Notice),
                      "6" | "info" => Ok(Self::Info),
                      "7" | "debug" => Ok(Self::Debug),
                      _ => Err(LogControlError(value.to_owned())),
                  }
              }

              pub const fn as_str(self) -> &'static str {
                  match self {
                      Self::Emerg => "emerg",
                      Self::Alert => "alert",
                      Self::Crit => "crit",
                      Self::Err => "err",
                      Self::Warning => "warning",
                      Self::Notice => "notice",
                      Self::Info => "info",
                      Self::Debug => "debug",
                  }
              }

              const fn from_u8(value: u8) -> Self {
                  match value {
                      0 => Self::Emerg,
                      1 => Self::Alert,
                      2 => Self::Crit,
                      3 => Self::Err,
                      4 => Self::Warning,
                      5 => Self::Notice,
                      7 => Self::Debug,
                      _ => Self::Info,
                  }
              }
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct LogControlError(String);

          impl fmt::Display for LogControlError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  write!(formatter, "invalid log level: {}", self.0)
              }
          }

          impl std::error::Error for LogControlError {}

          pub fn log_level() -> LogLevel {
              LogLevel::from_u8(LOG_LEVEL.load(Ordering::Acquire))
          }

          pub fn set_log_level(value: &str) -> Result<LogLevel, LogControlError> {
              let level = LogLevel::parse(value)?;
              LOG_LEVEL.store(level as u8, Ordering::Release);
              log::set_max_level(match level {
                  LogLevel::Emerg | LogLevel::Alert | LogLevel::Crit | LogLevel::Err => {
                      log::LevelFilter::Error
                  }
                  LogLevel::Warning => log::LevelFilter::Warn,
                  LogLevel::Notice | LogLevel::Info => log::LevelFilter::Info,
                  LogLevel::Debug => log::LevelFilter::Debug,
              });
              Ok(level)
          }

          pub fn enabled(level: log::Level) -> bool {
              level <= log::max_level()
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct LogControl;

          #[zbus::dbus_interface(name = "org.freedesktop.LogControl1")]
          impl LogControl {
              #[dbus_interface(property, name = "LogLevel")]
              fn log_level_property(&self) -> String {
                  log_level().as_str().to_owned()
              }

              #[dbus_interface(property, name = "LogLevel")]
              fn set_log_level_property(&self, value: &str) -> zbus::fdo::Result<()> {
                  set_log_level(value)
                      .map(|_| ())
                      .map_err(|error| zbus::fdo::Error::InvalidArgs(error.to_string()))
              }

              #[dbus_interface(property, name = "LogTarget")]
              fn log_target(&self) -> String {
                  LOG_TARGET.to_owned()
              }

              #[dbus_interface(property, name = "SyslogIdentifier")]
              fn syslog_identifier(&self) -> String {
                  SYSLOG_IDENTIFIER.to_owned()
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn levels_parse_and_round_trip() {
                  for (input, canonical) in [
                      ("emergency", "emerg"),
                      ("critical", "crit"),
                      ("error", "err"),
                      ("warn", "warning"),
                      ("notice", "notice"),
                      ("info", "info"),
                      ("debug", "debug"),
                  ] {
                      assert_eq!(LogLevel::parse(input).expect("level").as_str(), canonical);
                  }
                  assert!(LogLevel::parse("verbose").is_err());
              }

              #[test]
              fn setting_level_updates_the_process_filter() {
                  set_log_level("debug").expect("debug level");
                  assert_eq!(log_level(), LogLevel::Debug);
                  assert!(enabled(log::Level::Debug));
                  set_log_level("info").expect("info level");
                  assert!(!enabled(log::Level::Debug));
              }
          }
          EOF

          cat > src/bin/resolvectl_log_control.rs <<'EOF'
          // SPDX-License-Identifier: LGPL-2.1-or-later
          use std::env;

          const DESTINATION: &str = "org.freedesktop.resolve1";
          const PATH: &str = "/org/freedesktop/LogControl1";
          const INTERFACE: &str = "org.freedesktop.LogControl1";

          pub fn maybe_handle() -> Option<i32> {
              let arguments: Vec<String> = env::args().skip(1).collect();
              let position = arguments
                  .iter()
                  .position(|argument| argument == "log-level")?;
              Some(match run(&arguments[position + 1..]) {
                  Ok(output) => {
                      if let Some(output) = output {
                          println!("{output}");
                      }
                      0
                  }
                  Err(error) => {
                      eprintln!("resolvectl: {error}");
                      1
                  }
              })
          }

          fn run(arguments: &[String]) -> Result<Option<String>, String> {
              let values: Vec<_> = arguments
                  .iter()
                  .filter(|argument| !argument.starts_with('-'))
                  .collect();
              if values.len() > 1 {
                  return Err("log-level accepts at most one level".to_owned());
              }
              let connection = zbus::blocking::Connection::system()
                  .map_err(|error| format!("failed to connect to the system bus: {error}"))?;
              let proxy = zbus::blocking::Proxy::new(
                  &connection,
                  DESTINATION,
                  PATH,
                  INTERFACE,
              )
              .map_err(|error| format!("failed to create LogControl1 proxy: {error}"))?;
              if let Some(value) = values.first() {
                  proxy
                      .set_property("LogLevel", value.as_str())
                      .map_err(|error| format!("failed to set log level: {error}"))?;
                  Ok(None)
              } else {
                  proxy
                      .get_property::<String>("LogLevel")
                      .map(Some)
                      .map_err(|error| format!("failed to read log level: {error}"))
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn canonical_log_control_contract_is_pinned() {
                  assert_eq!(DESTINATION, "org.freedesktop.resolve1");
                  assert_eq!(PATH, "/org/freedesktop/LogControl1");
                  assert_eq!(INTERFACE, "org.freedesktop.LogControl1");
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          module_declared = False
          for path in [Path("src/lib.rs"), Path("src/landing_glue.rs")]:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              if re.search(r"(?m)^pub mod log_control;\s*$", text):
                  module_declared = True
                  break
              insertion = None
              matches = list(re.finditer(r"(?m)^(?:pub(?:\([^)]*\))?\s+)?mod\s+[A-Za-z0-9_]+;\s*$", text))
              if matches:
                  insertion = matches[-1].end()
              if insertion is not None:
                  text = text[:insertion] + "\npub mod log_control;" + text[insertion:]
                  path.write_text(text, encoding="utf-8")
                  module_declared = True
                  break
          if not module_declared:
              raise SystemExit("cannot expose log_control module")

          candidates = []
          for path in Path("src").glob("*.rs"):
              text = path.read_text(encoding="utf-8")
              if "org.freedesktop.resolve1" in text and ".build()" in text and "serve_at" in text:
                  candidates.append(path)
          if len(candidates) != 1:
              raise SystemExit(f"expected one D-Bus connection builder, found {candidates}")
          path = candidates[0]
          text = path.read_text(encoding="utf-8")
          if "/org/freedesktop/LogControl1" not in text:
              start = text.index("org.freedesktop.resolve1")
              builder_start = text.rfind("ConnectionBuilder", 0, start)
              if builder_start < 0:
                  builder_start = text.rfind("connection::Builder", 0, start)
              if builder_start < 0:
                  raise SystemExit("D-Bus connection builder start is missing")
              build = text.index(".build()", start)
              insertion = '''.serve_at(
                  "/org/freedesktop/LogControl1",
                  crate::log_control::LogControl,
              )?
                  '''
              text = text[:build] + insertion + text[build:]
              path.write_text(text, encoding="utf-8")

          cli = Path("src/bin/resolvectl.rs")
          text = cli.read_text(encoding="utf-8")
          if "mod resolvectl_log_control;" not in text:
              anchor = "mod resolvectl_monitor;\n"
              if anchor not in text:
                  raise SystemExit("resolvectl monitor module anchor is missing")
              text = text.replace(anchor, anchor + "mod resolvectl_log_control;\n", 1)
          if "resolvectl_log_control::maybe_handle()" not in text:
              anchor = "if let Some(status) = resolvectl_monitor::maybe_handle() {"
              position = text.find(anchor)
              if position < 0:
                  raise SystemExit("resolvectl early handler anchor is missing")
              insertion = '''if let Some(status) = resolvectl_log_control::maybe_handle() {
                  std::process::exit(status);
              }
              '''
              text = text[:position] + insertion + text[position:]
          cli.write_text(text, encoding="utf-8")

          guard = Path("tests/pinned_log_control.rs")
          guard.write_text(
              '''// SPDX-License-Identifier: LGPL-2.1-or-later
          const CONTROL: &str = include_str!("../src/log_control.rs");
          const CLI: &str = include_str!("../src/bin/resolvectl_log_control.rs");
          const ENTRYPOINT: &str = include_str!("../src/bin/resolvectl.rs");

          #[test]
          fn log_control_dbus_and_cli_contract_remain_wired() {
              for symbol in [
                  "org.freedesktop.LogControl1",
                  "LogLevel",
                  "LogTarget",
                  "SyslogIdentifier",
                  "log::set_max_level",
                  "resolvectl_log_control::maybe_handle",
                  "log-level",
                  "/org/freedesktop/LogControl1",
              ] {
                  assert!(
                      CONTROL.contains(symbol)
                          || CLI.contains(symbol)
                          || ENTRYPOINT.contains(symbol),
                      "missing log control symbol {symbol}"
                  );
              }
          }
          ''',
              encoding="utf-8",
          )
          PY

          rm -f .github/workflows/integrate-log-control.yml
          cargo fmt --all
          git diff --check

      - name: Verify native and package contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts and surface reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          python3 scripts/audit-upstream-resolver-surfaces.py --output /tmp/upstream-surface-audit.json
          python3 - <<'PY'
          import json

          with open("/tmp/upstream-surface-audit.json", encoding="utf-8") as stream:
              report = json.load(stream)
          if "log-level" in report["missing"]["resolvectl_verbs"]:
              raise SystemExit("resolvectl log-level remains missing")
          PY

      - name: Commit verified log-control tranche
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Expose resolved log control over D-Bus'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'resolved log control parity passed' || 'resolved log control parity failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/log-control","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null