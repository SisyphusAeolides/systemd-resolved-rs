name: Finalize replacement safety tools

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-replacement-safety.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install script diagnostics
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Harden and install final tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          proof_path = Path('scripts/write-replacement-proof.py')
          proof = proof_path.read_text(encoding='utf-8')
          old = '''            {
                "path": str(resolved),
                "size": resolved.stat().st_size,
                "sha256": sha256(resolved),
            }
'''
          new = '''            {
                "name": resolved.name,
                "path": str(resolved),
                "size": resolved.stat().st_size,
                "sha256": sha256(resolved),
            }
'''
          if '"name": resolved.name' not in proof:
              if old not in proof:
                  raise SystemExit('cannot locate proof artifact entry')
              proof = proof.replace(old, new, 1)
          proof_path.write_text(proof, encoding='utf-8')

          certificate_path = Path('scripts/certify-replacement-v2.sh')
          certificate = certificate_path.read_text(encoding='utf-8')
          old_runner = '''    {
        printf '$'
        printf ' %q' "$@"
        printf '\\n'
        "$@"
    } >"$log" 2>&1
    local status=$?
'''
          new_runner = '''    set +e
    {
        printf '$'
        printf ' %q' "$@"
        printf '\\n'
        "$@"
    } >"$log" 2>&1
    local status=$?
    set -e
'''
          if '    set +e\n    {' not in certificate:
              if old_runner not in certificate:
                  raise SystemExit('cannot locate certificate gate runner')
              certificate = certificate.replace(old_runner, new_runner, 1)
          Path('scripts/certify-replacement.sh').write_text(certificate, encoding='utf-8')

          switch_path = Path('scripts/switch-resolved-transactionally-v2.sh')
          switch = switch_path.read_text(encoding='utf-8')
          switch = switch.replace(
              '    systemctl disable --now "$GUARD_NAME" >/dev/null 2>&1 || true\n',
              '    systemctl disable "$GUARD_NAME" >/dev/null 2>&1 || true\n',
          )
          Path('scripts/switch-resolved-transactionally.sh').write_text(switch, encoding='utf-8')
          PY
          rm -f \
            scripts/certify-replacement-v2.sh \
            scripts/switch-resolved-transactionally-v2.sh
          chmod 0755 \
            scripts/certify-replacement.sh \
            scripts/switch-resolved-transactionally.sh \
            scripts/verify-upstream-resolved-baseline.sh \
            scripts/write-replacement-proof.py

      - name: Validate safety tools
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            scripts/certify-replacement.sh \
            scripts/switch-resolved-transactionally.sh \
            scripts/verify-upstream-resolved-baseline.sh
          python3 -m py_compile scripts/write-replacement-proof.py
          shellcheck \
            --severity=error \
            scripts/certify-replacement.sh \
            scripts/switch-resolved-transactionally.sh \
            scripts/verify-upstream-resolved-baseline.sh
          scripts/certify-replacement.sh --help >/dev/null
          scripts/switch-resolved-transactionally.sh --help >/dev/null
          scripts/write-replacement-proof.py --help >/dev/null
          git diff --check

      - name: Commit verified safety tools
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-replacement-safety.yml
          git add -A
          git diff --cached --check
          git commit -m 'Finalize fail-closed replacement safety tools'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
