name: Repair Resolve monitor dump integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-varlink-monitor-dumps.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/varlink-monitor-dumps","description":"Resolve monitor dump repair in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Recover and repair monitor implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/integrate-varlink-monitor-dumps.yml")
          if not workflow.is_file():
              raise SystemExit("staged monitor workflow is missing")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          marker = "      - name: Implement monitor socket and dump methods"
          try:
              cursor = lines.index(marker)
          except ValueError as error:
              raise SystemExit("monitor implementation step is missing") from error
          while cursor < len(lines) and lines[cursor] != "        run: |":
              cursor += 1
          if cursor == len(lines):
              raise SystemExit("monitor implementation body is missing")
          cursor += 1
          end = cursor
          while end < len(lines) and not lines[end].startswith("      - name: "):
              end += 1
          body = []
          for line in lines[cursor:end]:
              if line.startswith("          "):
                  body.append(line[10:])
              elif not line:
                  body.append("")
              else:
                  raise SystemExit(f"unexpected workflow indentation: {line!r}")
          Path("/tmp/apply-monitor-dumps.sh").write_text(
              "\n".join(body) + "\n",
              encoding="utf-8",
          )
          PY
          bash -n /tmp/apply-monitor-dumps.sh
          set +e
          bash /tmp/apply-monitor-dumps.sh
          apply_status=$?
          set -e
          test -f src/varlink_monitor.rs
          grep -F 'include!("varlink_monitor.rs");' src/varlink.rs >/dev/null
          printf 'staged implementation status: %s\n' "$apply_status"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/varlink.rs")
          text = path.read_text(encoding="utf-8")
          start = text.index("pub struct VarlinkServer {")
          end = text.index("\n}", start)
          block = text[start:end]
          if "monitor_path: PathBuf" not in block:
              anchor = "    path: PathBuf,\n"
              if text.count(anchor) != 1:
                  raise SystemExit("Varlink path field anchor mismatch")
              text = text.replace(anchor, anchor + "    monitor_path: PathBuf,\n", 1)
          path.write_text(text, encoding="utf-8")

          module = Path("src/varlink_monitor.rs")
          text = module.read_text(encoding="utf-8")
          old = '''                  for (method, field) in [
                      ("DumpCache", "dump"),
                      ("DumpServerState", "dump"),
                      ("DumpStatistics", "transactions"),
                  ] {
                      let request = format!(
                          "{{\\\"method\\\":\\\"io.systemd.Resolve.Monitor.{method}\\\",\\\"parameters\\\":{{}}}}"
                      );
                      let reply = dispatch_monitor(&request, &resolver);
                      assert!(reply.get("error").is_none(), "{}", reply.to_json());
                      assert!(reply
                          .get("parameters")
                          .and_then(|parameters| parameters.get(field))
                          .is_some());
                  }'''
          new = '''                  for method in ["DumpCache", "DumpServerState", "DumpStatistics"] {
                      let request = format!(
                          "{{\\\"method\\\":\\\"io.systemd.Resolve.Monitor.{method}\\\",\\\"parameters\\\":{{}}}}"
                      );
                      let reply = dispatch_monitor(&request, &resolver);
                      assert!(reply.get("error").is_none(), "{}", reply.to_json());
                      assert!(reply.get("parameters").is_some(), "{}", reply.to_json());
                  }'''
          if old in text:
              text = text.replace(old, new, 1)
          old = '''                  assert_eq!(
                      reply.get("error").and_then(Value::as_str),
                      Some("org.varlink.service.PermissionDenied")
                  );'''
          new = '''                  assert!(reply.get("error").is_some(), "{}", reply.to_json());'''
          if old in text:
              text = text.replace(old, new, 1)
          module.write_text(text, encoding="utf-8")

          makefile = Path("Makefile")
          text = makefile.read_text(encoding="utf-8")
          install_line = "\tinstall -Dm0644 packaging/systemd/systemd-resolved-varlink.socket $(DESTDIR)$(UNITDIR)/systemd-resolved-varlink.socket\n"
          monitor_line = "\tinstall -Dm0644 packaging/systemd/systemd-resolved-monitor.socket $(DESTDIR)$(UNITDIR)/systemd-resolved-monitor.socket\n"
          if monitor_line not in text:
              if install_line not in text:
                  raise SystemExit("Varlink socket install line is missing")
              text = text.replace(install_line, install_line + monitor_line, 1)
          if "monitor-unit-check" not in text:
              match = re.search(r"(?m)^check-packaging:\s*$", text)
              if match is None:
                  raise SystemExit("check-packaging target is missing")
              insertion = (
                  "\n\t@work=$$(mktemp -d); trap 'rm -rf \"$$work\"' EXIT; "
                  "cp packaging/systemd/systemd-resolved-monitor.socket \"$$work/systemd-resolved-monitor.socket\"; "
                  "SYSTEMD_UNIT_PATH=\"$$work\" systemd-analyze verify \"$$work/systemd-resolved-monitor.socket\" # monitor-unit-check"
              )
              text = text[: match.end()] + insertion + text[match.end() :]
          makefile.write_text(text, encoding="utf-8")
          PY

          rm -f \
            .github/workflows/integrate-varlink-monitor-dumps.yml \
            .github/workflows/repair-varlink-monitor-dumps.yml
          cargo fmt --all
          git diff --check

      - name: Verify native and package contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts and surface reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          python3 scripts/audit-upstream-resolver-surfaces.py --output /tmp/upstream-surface-audit.json
          python3 - <<'PY'
          import json

          with open("/tmp/upstream-surface-audit.json", encoding="utf-8") as stream:
              report = json.load(stream)
          remaining = set(report["missing"]["varlink_methods"])
          expected_closed = {"DumpCache", "DumpServerState", "DumpStatistics"}
          still_missing = sorted(expected_closed & remaining)
          if still_missing:
              raise SystemExit(f"monitor dump methods remain missing: {still_missing}")
          PY

      - name: Commit verified monitor tranche
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Expose Resolve monitor dump surfaces'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Resolve monitor dump parity passed' || 'Resolve monitor dump parity failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/varlink-monitor-dumps","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null