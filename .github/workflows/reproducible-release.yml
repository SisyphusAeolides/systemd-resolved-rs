name: Reproducible replacement release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran libssl-dev liburing-dev
      - name: Verify byte-identical release builds
        shell: bash
        run: bash scripts/build-reproducible-release.sh
      - name: Upload reproducible package and manifest
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-resolver-release-${{ github.sha }}
          path: target/reproducible-release
          if-no-files-found: error
          retention-days: 30
