name: Clean temporary maintenance workflows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-temporary-workflows.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/source-snapshot.yml \
            .github/workflows/finalize-shm-hardening.yml \
            .github/workflows/cleanup-temporary-workflows.yml
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "Remove temporary maintenance workflows"
          git push origin HEAD:main
