name: Normalize NSS generator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-nss-generator.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize generated NSS source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-nss-varlink-recovered.yml")
          text = workflow.read_text(encoding="utf-8")
          anchor = '''          elif corrected not in text:
              raise SystemExit("NSS Varlink IPv6 fixture anchor mismatch")
          path.write_text(text, encoding="utf-8")
          PY
'''
          replacement = '''          elif corrected not in text:
              raise SystemExit("NSS Varlink IPv6 fixture anchor mismatch")
          path.write_text(text, encoding="utf-8")

          stub = Path("nss/nss_dns_stub.c")
          stub.write_text(stub.read_text(encoding="utf-8").rstrip() + "\\n", encoding="utf-8")
          PY
'''
          if anchor not in text:
              if replacement in text:
                  raise SystemExit(0)
              raise SystemExit("NSS generator normalization anchor mismatch")
          workflow.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY

          rm -f .github/workflows/normalize-nss-generator.yml
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Normalize generated NSS source files"
          git push origin HEAD:main
