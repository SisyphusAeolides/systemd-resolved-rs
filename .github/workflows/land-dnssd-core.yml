name: Integrate DNS-SD core

on:
  push:
    branches:
      - main
    paths:
      - src/dnssd_full.rs
      - .github/workflows/land-dnssd-core.yml

permissions:
  contents: write

concurrency:
  group: integrate-dnssd-core
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gfortran libssl-dev liburing-dev

      - name: Integrate and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mdns.rs')
          text = path.read_text(encoding='utf-8')
          mdns_marker = '#[path = "mdns_full.rs"]\npub mod parity;\n'
          dnssd_marker = '#[path = "dnssd_full.rs"]\npub mod parity_dnssd;\n'
          if mdns_marker not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n' + mdns_marker
          if dnssd_marker not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n' + dnssd_marker
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo test --all-targets --all-features --locked mdns::parity
          cargo test --all-targets --all-features --locked mdns::parity_dnssd
          cargo clippy --all-targets --all-features --locked -- -D warnings
          git diff --check

      - name: Commit integration
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add src/mdns.rs src/mdns_full.rs src/dnssd_full.rs
          git rm --force .github/workflows/land-dnssd-core.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Integrate DNS-SD registration and browsing state'
          git push origin HEAD:main
