name: Finalize shared-memory hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-shm-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated shared-memory deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/supremacy/shm.rs")
          text = path.read_text()
          replacements = [
              (
                  "use std::os::unix::fs::{FileTypeExt, OpenOptionsExt};",
                  "use std::os::unix::fs::OpenOptionsExt;",
              ),
              (
                  "std::ptr::from_ref(address).cast::<u8>()",
                  "(address as *const ShmAddr).cast::<u8>()",
              ),
              (
                  "std::ptr::from_mut(&mut address).cast::<u8>()",
                  "(&mut address as *mut ShmAddr).cast::<u8>()",
              ),
              (
                  "std::ptr::from_ref(metadata)\n            .cast::<u8>()",
                  "(metadata as *const ShmBucket)\n            .cast::<u8>()",
              ),
              ("assert_eq!(actual, addresses);", "assert_eq!(actual.as_slice(), &addresses);"),
              (
                  "ShmPublisher::create_at(&path, 8, 64).unwrap();",
                  "ShmPublisher::create_at(&path, 8, 63).unwrap();",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one Rust replacement, found {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)

          path = Path("nss/nss_resolve_shm.c")
          text = path.read_text()
          replacements = [
              (
                  "        uint64_t before = __atomic_load_n(&mapped->write_gen, __ATOMIC_ACQUIRE);\n        memcpy(copy, mapped, sizeof *copy);",
                  "        uint64_t before = __atomic_load_n(&mapped->write_gen, __ATOMIC_ACQUIRE);\n        if ((before & 1u) != 0)\n            continue;\n        memcpy(copy, mapped, sizeof *copy);",
              ),
              (
                  "        uint64_t before = __atomic_load_n(&mapped->gen, __ATOMIC_ACQUIRE);\n        memcpy(copy, mapped, sizeof *copy);",
                  "        uint64_t before = __atomic_load_n(&mapped->gen, __ATOMIC_ACQUIRE);\n        if (before == 0 || (before & 1u) != 0)\n            return -1;\n        memcpy(copy, mapped, sizeof *copy);",
              ),
              (
                  "    if (clock_gettime(CLOCK_REALTIME, &now) != 0)\n        return 0;",
                  "    if (clock_gettime(CLOCK_REALTIME, &now) != 0)\n        return UINT64_MAX;",
              ),
              (
                  "        header.arena_off < sizeof(struct sr_hdr) + bucket_bytes ||",
                  "        header.arena_off != sizeof(struct sr_hdr) + bucket_bytes ||",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one C replacement, found {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Verify Rust 1.74 and NSS contracts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.74.0 --profile minimal --component rustfmt,clippy
          cargo +1.74.0 fmt --all -- --check
          cargo +1.74.0 clippy --all-targets --all-features --locked -- -D warnings
          cargo +1.74.0 test --all-features supremacy::shm::tests
          make check-nss
          git diff --check

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add src/supremacy/shm.rs nss/nss_resolve_shm.c
          git commit -m "Finish shared-memory seqlock hardening"
          git push origin HEAD:main
