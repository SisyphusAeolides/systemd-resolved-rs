name: Full replacement certification
run-name: Full replacement certification ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Git commit to certify; blank selects the dispatch-time main commit
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: full-replacement-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Resolve immutable source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test ${#sha} -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Dispatch prerequisite proof workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["SOURCE_SHA"]
          workflows = [
              "replacement-security-gates.yml",
              "replacement-upstream-test-75.yml",
              "replacement-boot-proof.yml",
          ]
          for workflow in workflows:
              request = urllib.request.Request(
                  f"{api}/repos/{repository}/actions/workflows/{workflow}/dispatches",
                  data=json.dumps(
                      {"ref": "main", "inputs": {"source_sha": sha}}
                  ).encode(),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit(
                          f"dispatch failed for {workflow}: HTTP {response.status}"
                      )
          PY

      - name: Wait for security, upstream, and boot gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["SOURCE_SHA"]
          expected = {
              "Replacement security gates": None,
              "Replacement upstream TEST-75 proof": None,
              "Replacement boot and rollback proof": None,
          }

          def request(path: str) -> dict:
              req = urllib.request.Request(
                  api + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          deadline = time.monotonic() + 3 * 60 * 60
          while time.monotonic() < deadline:
              query = urllib.parse.urlencode(
                  {"event": "workflow_dispatch", "branch": "main", "per_page": 100}
              )
              runs = request(
                  f"/repos/{repository}/actions/runs?{query}"
              ).get("workflow_runs", [])
              for workflow_name in list(expected):
                  matching = [
                      run
                      for run in runs
                      if run.get("name") == workflow_name
                      and sha in str(run.get("display_title", ""))
                  ]
                  if not matching:
                      continue
                  matching.sort(key=lambda run: run.get("created_at", ""), reverse=True)
                  run = matching[0]
                  if run.get("status") != "completed":
                      expected[workflow_name] = "running"
                  elif run.get("conclusion") == "success":
                      expected[workflow_name] = "success"
                  else:
                      raise SystemExit(
                          f"{workflow_name} failed: {run.get('html_url')} "
                          f"({run.get('conclusion')})"
                      )
              print(expected, flush=True)
              if all(value == "success" for value in expected.values()):
                  break
              time.sleep(30)
          else:
              raise SystemExit("timed out waiting for prerequisite proof workflows")
          PY

      - name: Dispatch the exact-SHA security proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/workflows/replacement-security-proof.yml/dispatches",
              data=json.dumps(
                  {
                      "ref": "main",
                      "inputs": {"source_sha": os.environ["SOURCE_SHA"]},
                  }
              ).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"security proof dispatch failed: {response.status}")
          PY

      - name: Wait for the bound security proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["SOURCE_SHA"]
          deadline = time.monotonic() + 30 * 60
          while time.monotonic() < deadline:
              query = urllib.parse.urlencode(
                  {"event": "workflow_dispatch", "branch": "main", "per_page": 30}
              )
              req = urllib.request.Request(
                  f"{api}/repos/{repository}/actions/workflows/"
                  f"replacement-security-proof.yml/runs?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  runs = json.load(response).get("workflow_runs", [])
              matching = [
                  run for run in runs if sha in str(run.get("display_title", ""))
              ]
              if matching:
                  matching.sort(key=lambda run: run.get("created_at", ""), reverse=True)
                  run = matching[0]
                  if run.get("status") == "completed":
                      if run.get("conclusion") == "success":
                          break
                      raise SystemExit(
                          f"security proof failed: {run.get('html_url')} "
                          f"({run.get('conclusion')})"
                      )
              time.sleep(20)
          else:
              raise SystemExit("timed out waiting for security proof")
          PY

      - name: Dispatch final readiness certificate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/workflows/replacement-readiness-certificate.yml/dispatches",
              data=json.dumps(
                  {
                      "ref": "main",
                      "inputs": {"source_sha": os.environ["SOURCE_SHA"]},
                  }
              ).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"readiness dispatch failed: {response.status}")
          PY

      - name: Wait for certified readiness artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          sha = os.environ["SOURCE_SHA"]
          deadline = time.monotonic() + 150 * 60
          while time.monotonic() < deadline:
              query = urllib.parse.urlencode(
                  {"event": "workflow_dispatch", "branch": "main", "per_page": 30}
              )
              req = urllib.request.Request(
                  f"{api}/repos/{repository}/actions/workflows/"
                  f"replacement-readiness-certificate.yml/runs?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  runs = json.load(response).get("workflow_runs", [])
              matching = [
                  run for run in runs if sha in str(run.get("display_title", ""))
              ]
              if matching:
                  matching.sort(key=lambda run: run.get("created_at", ""), reverse=True)
                  run = matching[0]
                  if run.get("status") == "completed":
                      if run.get("conclusion") == "success":
                          print(f"Certified readiness: {run.get('html_url')}")
                          break
                      raise SystemExit(
                          f"readiness certification failed: {run.get('html_url')} "
                          f"({run.get('conclusion')})"
                      )
              time.sleep(30)
          else:
              raise SystemExit("timed out waiting for readiness certificate")
          PY
