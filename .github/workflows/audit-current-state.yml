name: Export current repository state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-current-state.yml

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export source and Actions state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/repository-audit
          git rev-parse HEAD > /tmp/repository-audit/head
          git log -50 --date=iso-strict --format='%H%x09%cI%x09%s' > /tmp/repository-audit/recent-commits.tsv
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            > /tmp/repository-audit/actions-runs.json
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            > /tmp/repository-audit/workflows.json
          tar --exclude=.git --exclude=target --exclude=build \
            --exclude=.github/workflows/audit-current-state.yml \
            -czf /tmp/repository-audit/source.tar.gz .

      - name: Upload current state
        uses: actions/upload-artifact@v4
        with:
          name: repository-current-state
          path: /tmp/repository-audit
          if-no-files-found: error
          retention-days: 1

      - name: Remove export workflow
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/audit-current-state.yml
          git commit -m "Remove repository state exporter ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
