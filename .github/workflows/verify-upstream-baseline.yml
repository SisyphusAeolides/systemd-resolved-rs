name: Verify upstream resolver baseline

on:
  push:
    branches:
      - main
    paths:
      - compat/upstream-systemd/**
      - scripts/verify-upstream-resolved-baseline.sh
      - .github/workflows/verify-upstream-baseline.yml
  pull_request:
    paths:
      - compat/upstream-systemd/**
      - scripts/verify-upstream-resolved-baseline.sh
      - .github/workflows/verify-upstream-baseline.yml
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify immutable baseline
        shell: bash
        run: bash scripts/verify-upstream-resolved-baseline.sh
