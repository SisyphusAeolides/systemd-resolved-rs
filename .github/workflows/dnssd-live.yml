name: Live DNS-SD verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-dnssd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Detect integrated DNS-SD runtime
        id: integrated
        shell: bash
        run: |
          if grep -Fq '#[path = "dnssd_runtime.rs"]' src/mdns.rs; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build and namespace tools
        if: ${{ steps.integrated.outputs.value == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran iproute2 libssl-dev liburing-dev

      - name: Build release daemon
        if: ${{ steps.integrated.outputs.value == 'true' }}
        run: cargo build --release --all-features --locked

      - name: Exercise service publication and reload
        if: ${{ steps.integrated.outputs.value == 'true' }}
        shell: bash
        run: python3 tests/live-dnssd.py target/release/systemd-resolved

      - name: Explain staged DNS-SD code
        if: ${{ steps.integrated.outputs.value != 'true' }}
        run: echo 'DNS-SD publication is staged but has not passed its atomic integration gate yet.'
