name: Finalize pinned D-Bus contract verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-pinned-dbus-contract.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize with current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install D-Bus and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev systemd
      - name: Select the immutable upstream D-Bus manifests
        shell: bash
        run: |
          set -euo pipefail
          test -s compat/upstream-systemd/commit
          test -d compat/upstream-systemd/interfaces
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/dbus-introspection.sh')
          text = path.read_text(encoding='utf-8')
          variables = '''MANAGER_CONTRACT="$ROOT/compat/upstream-systemd/interfaces/org.freedesktop.resolve1.Manager.xml"
LINK_CONTRACT="$ROOT/compat/upstream-systemd/interfaces/org.freedesktop.resolve1.Link.xml"
if [[ ! -s $MANAGER_CONTRACT ]]; then
    MANAGER_CONTRACT="$ROOT/compat/org.freedesktop.resolve1.Manager.xml"
fi
if [[ ! -s $LINK_CONTRACT ]]; then
    LINK_CONTRACT="$ROOT/compat/org.freedesktop.resolve1.Link.xml"
fi
export MANAGER_CONTRACT LINK_CONTRACT
'''
          if 'MANAGER_CONTRACT=' not in text:
              anchor = 'export ROOT BINARY WORK\n'
              if anchor not in text:
                  raise SystemExit('cannot locate D-Bus test environment')
              text = text.replace(anchor, anchor + variables, 1)
          text = text.replace(
              'python3 "$ROOT/tests/compare-dbus-introspection.py" "$ROOT/compat/org.freedesktop.resolve1.Manager.xml" "$WORK/manager.xml" org.freedesktop.resolve1.Manager',
              'python3 "$ROOT/tests/compare-dbus-introspection.py" "$MANAGER_CONTRACT" "$WORK/manager.xml" org.freedesktop.resolve1.Manager',
          )
          text = text.replace(
              'python3 "$ROOT/tests/compare-dbus-introspection.py" "$ROOT/compat/org.freedesktop.resolve1.Link.xml" "$WORK/link.xml" org.freedesktop.resolve1.Link',
              'python3 "$ROOT/tests/compare-dbus-introspection.py" "$LINK_CONTRACT" "$WORK/link.xml" org.freedesktop.resolve1.Link',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify live contract against pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/dbus-introspection.sh
          cargo build --release --all-features --locked
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          git diff --check
      - name: Commit pinned live contract verification
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-pinned-dbus-contract.yml
          git add -A
          git diff --cached --check
          git commit -m 'Compare live D-Bus with the pinned upstream contract'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
