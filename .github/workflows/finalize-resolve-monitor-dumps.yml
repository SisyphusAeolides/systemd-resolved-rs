name: Finalize Resolve monitor dump parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-resolve-monitor-dumps.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/resolve-monitor-dumps","description":"Resolve monitor dump parity in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Implement monitor dumps, socket activation, and client verbs
        shell: bash
        run: |
          set -euo pipefail
          cat .parity/resolve-monitor-payload.00 \
              .parity/resolve-monitor-payload.01 \
              .parity/resolve-monitor-payload.02 \
              .parity/resolve-monitor-payload.03 \
            | base64 --decode >/tmp/resolve-monitor-payload.tar.gz
          printf '%s  %s\n' \
            '096f5d388344bfcdaa95bd5332d7c79f0f77e208dfadd2c26e0aaab32f538959' \
            '/tmp/resolve-monitor-payload.tar.gz' \
            | sha256sum --check --strict -
          tar -xzf /tmp/resolve-monitor-payload.tar.gz -C .
          python3 .parity/resolve-monitor-apply.py
          rm -rf .parity
          rm -f .github/workflows/finalize-resolve-monitor-dumps.yml
          cargo fmt --all
          git diff --check

      - name: Verify native, packaging, and NSS contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts and pinned surface reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          python3 scripts/audit-upstream-resolver-surfaces.py --output /tmp/upstream-surface-audit.json
          python3 - <<'PY'
          import json

          with open("/tmp/upstream-surface-audit.json", encoding="utf-8") as stream:
              report = json.load(stream)

          expected = {
              "dbus": [
                  {
                      "interface": "org.freedesktop.resolve1.DnssdService",
                      "kind": "signal",
                      "name": "Conflicted",
                  }
              ],
              "varlink_methods": [
                  "BrowseServices",
                  "QueryFilter",
                  "SubscribeDNSConfiguration",
                  "SubscribeQueryResults",
              ],
              "varlink_errors": [],
              "configuration_keys": [],
              "resolvectl_verbs": ["log-level"],
          }
          if report["missing"] != expected:
              raise SystemExit(
                  "unexpected resolver parity inventory:\n"
                  + json.dumps(report["missing"], indent=2, sort_keys=True)
              )
          if report["counts"]["missing_total"] != 6:
              raise SystemExit(
                  f"expected six remaining named gaps, found {report['counts']['missing_total']}"
              )
          PY

      - name: Commit verified monitor parity tranche
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Expose Resolve monitor dumps and socket parity'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Resolve monitor dump parity passed' || 'Resolve monitor dump parity failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/resolve-monitor-dumps","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
