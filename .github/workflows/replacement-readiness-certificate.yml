name: Replacement readiness certificate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install full certification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus \
            gfortran \
            iproute2 \
            libssl-dev \
            liburing-dev \
            python3 \
            systemd
          sudo systemctl unmask systemd-resolved.service >/dev/null 2>&1 || true
          sudo systemctl restart systemd-resolved.service
          sudo -n true

      - name: Download and validate exact-SHA proof artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/download-replacement-proofs.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --proof-directory target/replacement-proofs

      - name: Run fail-closed replacement certification
        id: certificate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/certify-replacement.sh \
            --proof-directory target/replacement-proofs \
            --output target/replacement-certification.json \
            --reference 127.0.0.53:53 \
            --candidate 127.0.0.1:10553
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("target/replacement-certification.json").read_text(encoding="utf-8")
          )
          if report.get("certified") is not True:
              raise SystemExit("the generated report is not certified")
          PY

      - name: Upload readiness certificate and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: replacement-readiness-${{ github.sha }}
          path: |
            target/replacement-certification.json
            target/replacement-certification.d
            target/replacement-proofs
          if-no-files-found: warn
          retention-days: 30
