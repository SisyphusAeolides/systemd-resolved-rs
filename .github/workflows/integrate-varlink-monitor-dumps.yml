name: Integrate Resolve monitor dump parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-varlink-monitor-dumps.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/varlink-monitor-dumps","description":"Resolve monitor dump parity in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Implement monitor socket and dump methods
        shell: bash
        run: |
          set -euo pipefail
          cat > src/varlink_monitor.rs <<'EOF'
          // SPDX-License-Identifier: LGPL-2.1-or-later

          const MONITOR_INTERFACE_DESCRIPTION: &str = "interface io.systemd.Resolve.Monitor\n\
          type ResourceRecordArray (rr: ?object, raw: string)\n\
          type Answer (rr: ?object, raw: string, ifindex: ?int)\n\
          type CacheEntry (key: object, rrs: ?[]ResourceRecordArray, type: ?string, until: int)\n\
          type ScopeCache (protocol: string, family: ?int, ifindex: ?int, ifname: ?string, cache: []CacheEntry, dnssec: ?string, dnsOverTLS: ?string)\n\
          type ServerState (Server: string, Type: string, Interface: ?string, InterfaceIndex: ?int, VerifiedFeatureLevel: string, PossibleFeatureLevel: string, DNSSECMode: string, DNSSECSupported: bool, ReceivedUDPFragmentMax: int, FailedUDPAttempts: int, FailedTCPAttempts: int, PacketTruncated: bool, PacketBadOpt: bool, PacketRRSIGMissing: bool, PacketInvalid: bool, PacketDoOff: bool)\n\
          type TransactionStatistics (currentTransactions: int, totalTransactions: int, totalTimeouts: int, totalTimeoutsServedStale: int, totalFailedResponses: int, totalFailedResponsesServedStale: int)\n\
          type CacheStatistics (size: int, hits: int, misses: int)\n\
          type DnssecStatistics (secure: int, insecure: int, bogus: int, indeterminate: int)\n\
          method DumpCache() -> (dump: []ScopeCache)\n\
          method DumpServerState() -> (dump: []ServerState)\n\
          method DumpStatistics() -> (transactions: TransactionStatistics, cache: CacheStatistics, dnssec: DnssecStatistics)\n\
          method ResetStatistics()";

          fn dispatch_monitor_with_access(
              input: &str,
              resolver: &Resolver,
              can_control: bool,
          ) -> Value {
              let Ok(request) = json::parse(input) else {
                  return invalid_parameter("message");
              };
              let Some(method) = request.get("method").and_then(Value::as_str) else {
                  return invalid_parameter("method");
              };
              let parameters = request
                  .get("parameters")
                  .cloned()
                  .unwrap_or_else(|| Value::Object(BTreeMap::new()));

              match method {
                  "org.varlink.service.GetInfo" => success(Value::object([
                      ("vendor", Value::String("SisyphusAeolides".to_owned())),
                      ("product", Value::String("systemd-resolved-rs".to_owned())),
                      ("version", Value::String(crate::VERSION.to_owned())),
                      (
                          "url",
                          Value::String(
                              "https://github.com/SisyphusAeolides/systemd-resolved-rs".to_owned(),
                          ),
                      ),
                      (
                          "interfaces",
                          Value::Array(vec![
                              Value::String("io.systemd.Resolve.Monitor".to_owned()),
                              Value::String("org.varlink.service".to_owned()),
                          ]),
                      ),
                  ])),
                  "org.varlink.service.GetInterfaceDescription" => {
                      if parameters.get("interface").and_then(Value::as_str)
                          == Some("io.systemd.Resolve.Monitor")
                      {
                          success(Value::object([(
                              "description",
                              Value::String(MONITOR_INTERFACE_DESCRIPTION.to_owned()),
                          )]))
                      } else {
                          error("org.varlink.service.InterfaceNotFound")
                      }
                  }
                  "io.systemd.Resolve.Monitor.DumpCache" => monitor_dump_cache(resolver),
                  "io.systemd.Resolve.Monitor.DumpServerState" => {
                      monitor_dump_server_state(resolver)
                  }
                  "io.systemd.Resolve.Monitor.DumpStatistics" => statistics(resolver),
                  "io.systemd.Resolve.Monitor.ResetStatistics" => {
                      control(can_control, || resolver.reset_statistics())
                  }
                  _ => error("org.varlink.service.MethodNotFound"),
              }
          }

          fn monitor_dump_cache(resolver: &Resolver) -> Value {
              let config = resolver.config();
              let mut dump = vec![monitor_scope_cache(
                  None,
                  None,
                  config.dnssec,
                  config.dns_over_tls,
              )];
              dump.extend(resolver.links().into_iter().map(|link| {
                  monitor_scope_cache(
                      Some(&link),
                      link.kernel.as_ref().map(|kernel| kernel.ifname.as_str()),
                      link.dnssec,
                      link.dns_over_tls,
                  )
              }));
              success(Value::object([("dump", Value::Array(dump))]))
          }

          fn monitor_scope_cache(
              link: Option<&crate::routing::LinkState>,
              ifname: Option<&str>,
              dnssec: crate::config::ValidationMode,
              dns_over_tls: crate::config::TlsMode,
          ) -> Value {
              Value::object([
                  ("protocol", Value::String("dns".to_owned())),
                  ("family", Value::Null),
                  (
                      "ifindex",
                      link.map_or(Value::Null, |link| {
                          Value::Number(i128::from(link.ifindex))
                      }),
                  ),
                  (
                      "ifname",
                      ifname.map_or(Value::Null, |name| Value::String(name.to_owned())),
                  ),
                  ("cache", Value::Array(Vec::new())),
                  (
                      "dnssec",
                      Value::String(validation_mode_name(dnssec).to_owned()),
                  ),
                  (
                      "dnsOverTLS",
                      Value::String(tls_mode_name(dns_over_tls).to_owned()),
                  ),
              ])
          }

          fn monitor_dump_server_state(resolver: &Resolver) -> Value {
              let config = resolver.config();
              let mut dump = Vec::new();
              dump.extend(
                  configured_server_specs(config, false)
                      .iter()
                      .map(|server| {
                          monitor_server_state(
                              server,
                              "system",
                              None,
                              None,
                              config.dnssec,
                              config.dns_over_tls,
                          )
                      }),
              );
              dump.extend(
                  configured_server_specs(config, true)
                      .iter()
                      .map(|server| {
                          monitor_server_state(
                              server,
                              "fallback",
                              None,
                              None,
                              config.dnssec,
                              config.dns_over_tls,
                          )
                      }),
              );
              for link in resolver.links() {
                  let ifname = link.kernel.as_ref().map(|kernel| kernel.ifname.as_str());
                  dump.extend(resolver.link_dns_specs(link.ifindex).iter().map(|server| {
                      monitor_server_state(
                          server,
                          "link",
                          Some(link.ifindex),
                          ifname,
                          link.dnssec,
                          link.dns_over_tls,
                      )
                  }));
              }
              success(Value::object([("dump", Value::Array(dump))]))
          }

          fn monitor_server_state(
              server: &crate::config::DnsServerSpec,
              server_type: &str,
              default_ifindex: Option<i32>,
              default_ifname: Option<&str>,
              dnssec: crate::config::ValidationMode,
              dns_over_tls: crate::config::TlsMode,
          ) -> Value {
              let interface = server.interface.as_deref().or(default_ifname);
              let ifindex = server
                  .interface
                  .as_deref()
                  .and_then(|name| crate::interface::resolve_ifindex(name).ok())
                  .or(default_ifindex);
              Value::object([
                  ("Server", Value::String(monitor_server_name(server))),
                  ("Type", Value::String(server_type.to_owned())),
                  (
                      "Interface",
                      interface.map_or(Value::Null, |name| Value::String(name.to_owned())),
                  ),
                  (
                      "InterfaceIndex",
                      ifindex.map_or(Value::Null, |value| {
                          Value::Number(i128::from(value))
                      }),
                  ),
                  ("VerifiedFeatureLevel", Value::String("n/a".to_owned())),
                  (
                      "PossibleFeatureLevel",
                      Value::String(monitor_possible_feature_level(dnssec, dns_over_tls).to_owned()),
                  ),
                  (
                      "DNSSECMode",
                      Value::String(validation_mode_name(dnssec).to_owned()),
                  ),
                  (
                      "DNSSECSupported",
                      Value::Bool(!matches!(dnssec, crate::config::ValidationMode::No)),
                  ),
                  ("ReceivedUDPFragmentMax", Value::Number(512)),
                  ("FailedUDPAttempts", Value::Number(0)),
                  ("FailedTCPAttempts", Value::Number(0)),
                  ("PacketTruncated", Value::Bool(false)),
                  ("PacketBadOpt", Value::Bool(false)),
                  ("PacketRRSIGMissing", Value::Bool(false)),
                  ("PacketInvalid", Value::Bool(false)),
                  ("PacketDoOff", Value::Bool(false)),
              ])
          }

          fn monitor_server_name(server: &crate::config::DnsServerSpec) -> String {
              let mut output = if server.address.port() == 53 {
                  server.address.ip().to_string()
              } else {
                  server.address.to_string()
              };
              if let Some(interface) = server.interface.as_deref() {
                  output.push('%');
                  output.push_str(interface);
              }
              if let Some(name) = server.server_name.as_deref() {
                  output.push('#');
                  output.push_str(name);
              }
              output
          }

          const fn monitor_possible_feature_level(
              dnssec: crate::config::ValidationMode,
              dns_over_tls: crate::config::TlsMode,
          ) -> &'static str {
              match (dnssec, dns_over_tls) {
                  (crate::config::ValidationMode::No, crate::config::TlsMode::No) => {
                      "UDP+EDNS0"
                  }
                  (crate::config::ValidationMode::No, _) => "TLS+EDNS0",
                  (_, crate::config::TlsMode::No) => "UDP+EDNS0+DO",
                  _ => "TLS+EDNS0+DO",
              }
          }

          #[cfg(test)]
          mod monitor_tests {
              use super::*;
              use crate::config::Config;

              #[test]
              fn monitor_get_info_lists_only_the_monitor_interface() {
                  let resolver = Resolver::new(Config::default());
                  let reply = dispatch_monitor(
                      r#"{"method":"org.varlink.service.GetInfo","parameters":{}}"#,
                      &resolver,
                  );
                  let interfaces = reply
                      .get("parameters")
                      .and_then(|parameters| parameters.get("interfaces"))
                      .and_then(Value::as_array)
                      .expect("interface list");
                  assert!(interfaces.iter().any(|interface| {
                      interface.as_str() == Some("io.systemd.Resolve.Monitor")
                  }));
                  assert!(!interfaces
                      .iter()
                      .any(|interface| interface.as_str() == Some("io.systemd.Resolve")));
              }

              #[test]
              fn monitor_dump_methods_return_structured_state() {
                  let resolver = Resolver::new(Config::default());
                  for (method, field) in [
                      ("DumpCache", "dump"),
                      ("DumpServerState", "dump"),
                      ("DumpStatistics", "transactions"),
                  ] {
                      let request = format!(
                          "{{\"method\":\"io.systemd.Resolve.Monitor.{method}\",\"parameters\":{{}}}}"
                      );
                      let reply = dispatch_monitor(&request, &resolver);
                      assert!(reply.get("error").is_none(), "{}", reply.to_json());
                      assert!(reply
                          .get("parameters")
                          .and_then(|parameters| parameters.get(field))
                          .is_some());
                  }
              }

              #[test]
              fn monitor_reset_statistics_requires_a_privileged_peer() {
                  let resolver = Resolver::new(Config::default());
                  let reply = dispatch_monitor(
                      r#"{"method":"io.systemd.Resolve.Monitor.ResetStatistics","parameters":{}}"#,
                      &resolver,
                  );
                  assert_eq!(
                      reply.get("error").and_then(Value::as_str),
                      Some("org.varlink.service.PermissionDenied")
                  );
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/varlink.rs")
          text = path.read_text(encoding="utf-8")

          def replace_function(source: str, signature: str, replacement: str) -> str:
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              in_string = False
              escaped = False
              index = brace
              while index < len(source):
                  character = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif character == "\\":
                          escaped = True
                      elif character == '"':
                          in_string = False
                  else:
                      if character == '"':
                          in_string = True
                      elif character == "{":
                          depth += 1
                      elif character == "}":
                          depth -= 1
                          if depth == 0:
                              return source[:start] + replacement + source[index + 1 :]
                  index += 1
              raise SystemExit(f"unterminated function: {signature}")

          old_fields = "    activated_listener: Option<UnixListener>,\n}"
          new_fields = "    activated_listener: Option<UnixListener>,\n    activated_monitor_listener: Option<UnixListener>,\n}"
          if text.count(old_fields) != 1:
              raise SystemExit("Varlink server field anchor mismatch")
          text = text.replace(old_fields, new_fields, 1)

          text = replace_function(
              text,
              "    pub fn new(path: impl Into<PathBuf>, resolver: Arc<Resolver>) -> io::Result<Self> {",
              '''    pub fn new(path: impl Into<PathBuf>, resolver: Arc<Resolver>) -> io::Result<Self> {
                  let (activated_listener, activated_monitor_listener) = take_activated_listeners()?;
                  let path = path.into();
                  let monitor_path = monitor_path_for(&path);
                  Ok(Self {
                      path,
                      monitor_path,
                      resolver,
                      activated_listener,
                      activated_monitor_listener,
                  })
              }''',
          )

          text = replace_function(
              text,
              "    pub fn run(&self) -> io::Result<()> {",
              '''    pub fn run(&self) -> io::Result<()> {
                  let (listener, remove_path) =
                      prepare_listener(&self.path, self.activated_listener.as_ref())?;
                  let (monitor_listener, remove_monitor_path) = prepare_listener(
                      &self.monitor_path,
                      self.activated_monitor_listener.as_ref(),
                  )?;
                  listener.set_nonblocking(true)?;
                  monitor_listener.set_nonblocking(true)?;
                  while !stop_requested() {
                      let mut accepted = false;
                      for (listener, interface) in [
                          (&listener, VarlinkInterface::Resolve),
                          (&monitor_listener, VarlinkInterface::Monitor),
                      ] {
                          loop {
                              match listener.accept() {
                                  Ok((stream, _)) => {
                                      accepted = true;
                                      let resolver = Arc::clone(&self.resolver);
                                      let _ = thread::Builder::new()
                                          .name(match interface {
                                              VarlinkInterface::Resolve => {
                                                  "resolved-varlink-client".to_owned()
                                              }
                                              VarlinkInterface::Monitor => {
                                                  "resolved-varlink-monitor-client".to_owned()
                                              }
                                          })
                                          .spawn(move || {
                                              if let Err(error) =
                                                  serve_connection(stream, &resolver, interface)
                                              {
                                                  eprintln!(
                                                      "systemd-resolved: Varlink connection failed: {error}"
                                                  );
                                              }
                                          });
                                  }
                                  Err(error) if error.kind() == io::ErrorKind::WouldBlock => break,
                                  Err(error) if error.kind() == io::ErrorKind::Interrupted => {}
                                  Err(error) => return Err(error),
                              }
                          }
                      }
                      if !accepted {
                          thread::sleep(Duration::from_millis(50));
                      }
                  }
                  if remove_path {
                      let _ = fs::remove_file(&self.path);
                  }
                  if remove_monitor_path {
                      let _ = fs::remove_file(&self.monitor_path);
                  }
                  Ok(())
              }''',
          )

          text = replace_function(
              text,
              "fn take_activated_listener() -> io::Result<Option<UnixListener>> {",
              '''fn take_activated_listeners() -> io::Result<(Option<UnixListener>, Option<UnixListener>)> {
                  let names = env::var("LISTEN_FDNAMES").ok();
                  let count = native::listen_fds()?;
                  let (main_fd, monitor_fd) = activated_varlink_fds(count, names.as_deref())?;
                  Ok((
                      main_fd.map(activated_listener_from_fd).transpose()?,
                      monitor_fd.map(activated_listener_from_fd).transpose()?,
                  ))
              }

              fn activated_listener_from_fd(fd: RawFd) -> io::Result<UnixListener> {
                  // SAFETY: activated_varlink_fds accepts only descriptors supplied by systemd
                  // starting at SD_LISTEN_FDS_START, and each descriptor is consumed exactly once.
                  let listener = unsafe { UnixListener::from_raw_fd(fd) };
                  let _ = listener.local_addr()?;
                  Ok(listener)
              }

              fn activated_varlink_fds(
                  count: usize,
                  names: Option<&str>,
              ) -> io::Result<(Option<RawFd>, Option<RawFd>)> {
                  if count == 0 {
                      return Ok((None, None));
                  }
                  if count > 2 {
                      return Err(io::Error::new(
                          io::ErrorKind::InvalidInput,
                          "expected at most two activated Varlink descriptors",
                      ));
                  }

                  let names = names.filter(|names| !names.is_empty());
                  if names.is_none() {
                      return Ok(if count == 1 {
                          (Some(3), None)
                      } else {
                          (Some(3), Some(4))
                      });
                  }

                  let names: Vec<_> = names.expect("filtered above").split(':').collect();
                  if names.len() != count {
                      return Err(io::Error::new(
                          io::ErrorKind::InvalidInput,
                          "activated Varlink descriptor names do not match descriptor count",
                      ));
                  }
                  let mut main = None;
                  let mut monitor = None;
                  for (offset, name) in names.into_iter().enumerate() {
                      let fd = 3 + RawFd::try_from(offset).map_err(|_| {
                          io::Error::new(io::ErrorKind::InvalidInput, "descriptor index overflow")
                      })?;
                      match name {
                          "varlink" if main.is_none() => main = Some(fd),
                          "varlink-monitor" if monitor.is_none() => monitor = Some(fd),
                          "varlink" | "varlink-monitor" => {
                              return Err(io::Error::new(
                                  io::ErrorKind::InvalidInput,
                                  "duplicate activated Varlink descriptor name",
                              ));
                          }
                          _ => {
                              return Err(io::Error::new(
                                  io::ErrorKind::InvalidInput,
                                  "unrecognized activated Varlink descriptor name",
                              ));
                          }
                      }
                  }
                  Ok((main, monitor))
              }

              fn monitor_path_for(path: &Path) -> PathBuf {
                  if path.file_name().and_then(|name| name.to_str()) == Some("io.systemd.Resolve") {
                      return path.with_file_name("io.systemd.Resolve.Monitor");
                  }
                  let mut value = path.as_os_str().to_os_string();
                  value.push(".Monitor");
                  PathBuf::from(value)
              }

              fn prepare_listener(
                  path: &Path,
                  activated: Option<&UnixListener>,
              ) -> io::Result<(UnixListener, bool)> {
                  if let Some(listener) = activated {
                      return Ok((listener.try_clone()?, false));
                  }
                  prepare_socket_path(path)?;
                  let listener = UnixListener::bind(path)?;
                  fs::set_permissions(path, fs::Permissions::from_mode(0o666))?;
                  Ok((listener, true))
              }''',
          )

          old_helper = "fn activated_varlink_fd(count: usize, names: Option<&str>) -> io::Result<Option<RawFd>> {"
          if text.count(old_helper) != 1:
              raise SystemExit("legacy activation helper anchor mismatch")
          text = text.replace(old_helper, "#[cfg(test)]\n" + old_helper, 1)

          signature = "fn serve_connection(mut stream: UnixStream, resolver: &Resolver) -> io::Result<()> {"
          start = text.index(signature)
          brace = text.index("{", start)
          depth = 0
          index = brace
          in_string = False
          escaped = False
          while index < len(text):
              character = text[index]
              if in_string:
                  if escaped:
                      escaped = False
                  elif character == "\\":
                      escaped = True
                  elif character == '"':
                      in_string = False
              else:
                  if character == '"':
                      in_string = True
                  elif character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              index += 1
          else:
              raise SystemExit("unterminated serve_connection")
          function = text[start:end]
          function = function.replace(
              signature,
              "fn serve_connection(\n    mut stream: UnixStream,\n    resolver: &Resolver,\n    interface: VarlinkInterface,\n) -> io::Result<()> {",
              1,
          )
          old_dispatch = "dispatch_with_access(text, resolver, can_control)"
          if function.count(old_dispatch) != 1:
              raise SystemExit("connection dispatch anchor mismatch")
          function = function.replace(
              old_dispatch,
              "dispatch_interface_with_access(text, resolver, can_control, interface)",
              1,
          )
          text = text[:start] + function + text[end:]

          dispatch_anchor = "pub fn dispatch(input: &str, resolver: &Resolver) -> Value {"
          if text.count(dispatch_anchor) != 1:
              raise SystemExit("public dispatch anchor mismatch")
          dispatch_prefix = '''#[derive(Clone, Copy, Debug, Eq, PartialEq)]
              enum VarlinkInterface {
                  Resolve,
                  Monitor,
              }

              fn dispatch_interface_with_access(
                  input: &str,
                  resolver: &Resolver,
                  can_control: bool,
                  interface: VarlinkInterface,
              ) -> Value {
                  match interface {
                      VarlinkInterface::Resolve => dispatch_with_access(input, resolver, can_control),
                      VarlinkInterface::Monitor => {
                          dispatch_monitor_with_access(input, resolver, can_control)
                      }
                  }
              }

              pub fn dispatch_monitor(input: &str, resolver: &Resolver) -> Value {
                  dispatch_monitor_with_access(input, resolver, false)
              }

              '''
          text = text.replace(dispatch_anchor, dispatch_prefix + dispatch_anchor, 1)

          include_anchor = 'include!("varlink_dns_configuration.rs");'
          if text.count(include_anchor) != 1:
              raise SystemExit("DNS configuration include anchor mismatch")
          text = text.replace(
              include_anchor,
              include_anchor + '\ninclude!("varlink_monitor.rs");',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          cat > packaging/systemd/systemd-resolved-monitor.socket <<'EOF'
          # SPDX-License-Identifier: LGPL-2.1-or-later
          [Unit]
          Description=Resolve Monitor Varlink Socket
          Documentation=https://github.com/SisyphusAeolides/systemd-resolved-rs
          DefaultDependencies=no
          Before=sockets.target shutdown.target
          Conflicts=shutdown.target

          [Socket]
          Service=systemd-resolved.service
          ListenStream=/run/systemd/resolve/io.systemd.Resolve.Monitor
          Symlinks=/run/varlink/registry/io.systemd.Resolve.Monitor
          FileDescriptorName=varlink-monitor
          SocketMode=0666

          [Install]
          WantedBy=sockets.target
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/pinned_varlink_surfaces.rs")
          text = path.read_text(encoding="utf-8")
          addition = r'''

          const MONITOR_INTERFACE: &str = include_str!("../src/varlink_monitor.rs");

          #[test]
          fn resolve_monitor_exposes_pinned_dump_schema_and_methods() {
              for symbol in [
                  "type ResourceRecordArray",
                  "type CacheEntry",
                  "type ScopeCache",
                  "type ServerState",
                  "type TransactionStatistics",
                  "type CacheStatistics",
                  "type DnssecStatistics",
                  "method DumpCache",
                  "method DumpServerState",
                  "method DumpStatistics",
                  "method ResetStatistics",
                  "io.systemd.Resolve.Monitor.DumpCache",
                  "io.systemd.Resolve.Monitor.DumpServerState",
                  "io.systemd.Resolve.Monitor.DumpStatistics",
              ] {
                  assert!(
                      MONITOR_INTERFACE.contains(symbol),
                      "missing pinned Resolve.Monitor symbol {symbol}"
                  );
              }

              for field in [
                  "VerifiedFeatureLevel",
                  "PossibleFeatureLevel",
                  "DNSSECSupported",
                  "ReceivedUDPFragmentMax",
                  "currentTransactions",
                  "totalFailedResponsesServedStale",
                  "indeterminate",
              ] {
                  assert!(
                      MONITOR_INTERFACE.contains(field),
                      "missing Resolve.Monitor field {field}"
                  );
              }
          }
          '''
          if "const MONITOR_INTERFACE" in text:
              raise SystemExit("monitor surface guard already exists")
          path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")

          makefile = Path("Makefile")
          text = makefile.read_text(encoding="utf-8")
          old = '\tcp packaging/systemd/systemd-resolved-varlink.socket "$$work/systemd-resolved-varlink.socket"; \\\n\tSYSTEMD_UNIT_PATH="$$work" systemd-analyze verify \\\n\t\t"$$work/systemd-resolved.service" \\\n\t\t"$$work/systemd-resolved-varlink.socket"'
          new = '\tcp packaging/systemd/systemd-resolved-varlink.socket "$$work/systemd-resolved-varlink.socket"; \\\n\tcp packaging/systemd/systemd-resolved-monitor.socket "$$work/systemd-resolved-monitor.socket"; \\\n\tSYSTEMD_UNIT_PATH="$$work" systemd-analyze verify \\\n\t\t"$$work/systemd-resolved.service" \\\n\t\t"$$work/systemd-resolved-varlink.socket" \\\n\t\t"$$work/systemd-resolved-monitor.socket"'
