name: Integrate pinned QueryFilter client parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-query-filter-client.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/query-filter-client","description":"Pinned QueryFilter client parity in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f compat/query-filter-upstream.json

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran libssl-dev liburing-dev openssl python3 systemd
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Implement client-side query filtering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("compat/query-filter-upstream.json").read_text(encoding="utf-8"))
          if report["role"] not in {"client", "both"}:
              raise SystemExit(
                  f"pinned QueryFilter is not a client callback: {report['role']}"
              )
          inputs = [
              field["name"]
              for field in report["fields"]
              if field["direction"] == "input"
          ]
          outputs = [
              field["name"]
              for field in report["fields"]
              if field["direction"] == "output"
          ]
          if not inputs or not outputs:
              raise SystemExit("pinned QueryFilter has no parsed inputs or outputs")

          quoted_inputs = ", ".join(json.dumps(value) for value in inputs)
          quoted_outputs = ", ".join(json.dumps(value) for value in outputs)
          source = f'''// SPDX-License-Identifier: LGPL-2.1-or-later
          use crate::json::{{self, Value}};
          use std::collections::BTreeMap;
          use std::env;
          use std::io::{{self, Read, Write}};
          use std::net::IpAddr;
          use std::os::unix::net::UnixStream;
          use std::path::Path;
          use std::time::Duration;

          const QUERY_FILTER_METHOD: &str = "io.systemd.Resolve.QueryFilter";
          const QUERY_FILTER_INPUT_FIELDS: &[&str] = &[{quoted_inputs}];
          const QUERY_FILTER_OUTPUT_FIELDS: &[&str] = &[{quoted_outputs}];
          const MAX_FILTER_MESSAGE_SIZE: usize = 1024 * 1024;

          pub(crate) fn filter_response(request: &[u8]) -> Option<Vec<u8>> {{
              let socket = env::var_os("SYSTEMD_RESOLVED_QUERY_FILTER_SOCKET")?;
              let socket = Path::new(&socket);
              let question = crate::wire::parse_question(request).ok()?;
              let parameters = query_filter_parameters(&question, request);
              let reply = query_filter_call(socket, parameters).ok()?;
              apply_filter_reply(request, &reply)
          }}

          fn query_filter_parameters(
              question: &crate::wire::Question,
              request: &[u8],
          ) -> Value {{
              let mut parameters = BTreeMap::new();
              for field in QUERY_FILTER_INPUT_FIELDS {{
                  let value = match *field {{
                      "name" | "qname" => Value::String(question.name.clone()),
                      "class" | "qclass" => Value::Number(i128::from(question.class)),
                      "type" | "qtype" => Value::Number(i128::from(question.record_type)),
                      "ifindex" => Value::Number(0),
                      "family" => Value::Number(0),
                      "flags" => Value::Number(0),
                      "protocol" => Value::String("dns".to_owned()),
                      "question" => Value::object([
                          ("name", Value::String(question.name.clone())),
                          ("class", Value::Number(i128::from(question.class))),
                          ("type", Value::Number(i128::from(question.record_type))),
                      ]),
                      "questions" | "collectedQuestions" => Value::Array(vec![
                          Value::object([
                              ("name", Value::String(question.name.clone())),
                              ("class", Value::Number(i128::from(question.class))),
                              ("type", Value::Number(i128::from(question.record_type))),
                          ]),
                      ]),
                      "raw" | "packet" | "query" => {
                          Value::String(base64(request))
                      }
                      "address" => Value::Array(Vec::new()),
                      "addressString" => Value::String(String::new()),
                      "server" => Value::Null,
                      _ => Value::Null,
                  }};
                  parameters.insert((*field).to_owned(), value);
              }}
              Value::Object(parameters)
          }}

          fn query_filter_call(socket: &Path, parameters: Value) -> io::Result<Value> {{
              let mut stream = UnixStream::connect(socket)?;
              stream.set_read_timeout(Some(Duration::from_secs(2)))?;
              stream.set_write_timeout(Some(Duration::from_secs(2)))?;
              let request = Value::object([
                  ("method", Value::String(QUERY_FILTER_METHOD.to_owned())),
                  ("parameters", parameters),
              ]);
              stream.write_all(request.to_json().as_bytes())?;
              stream.write_all(&[0])?;

              let mut pending = Vec::new();
              let mut chunk = [0; 4096];
              loop {{
                  let length = stream.read(&mut chunk)?;
                  if length == 0 {{
                      return Err(io::Error::new(
                          io::ErrorKind::UnexpectedEof,
                          "query filter closed before replying",
                      ));
                  }}
                  if let Some(end) = chunk[..length].iter().position(|byte| *byte == 0) {{
                      pending.extend_from_slice(&chunk[..end]);
                      break;
                  }}
                  pending.extend_from_slice(&chunk[..length]);
                  if pending.len() > MAX_FILTER_MESSAGE_SIZE {{
                      return Err(io::Error::new(
                          io::ErrorKind::InvalidData,
                          "query filter reply is too large",
                      ));
                  }}
              }}
              let text = std::str::from_utf8(&pending).map_err(|_| {{
                  io::Error::new(io::ErrorKind::InvalidData, "query filter reply is not UTF-8")
              }})?;
              let reply = json::parse(text).map_err(|error| {{
                  io::Error::new(io::ErrorKind::InvalidData, error.to_string())
              }})?;
              if let Some(error) = reply.get("error").and_then(Value::as_str) {{
                  return Err(io::Error::other(error.to_owned()));
              }}
              reply.get("parameters").cloned().ok_or_else(|| {{
                  io::Error::new(
                      io::ErrorKind::InvalidData,
                      "query filter reply has no parameters",
                  )
              }})
          }}

          fn apply_filter_reply(request: &[u8], reply: &Value) -> Option<Vec<u8>> {{
              let decision = filter_decision(reply);
              match decision {{
                  FilterDecision::Allow => None,
                  FilterDecision::Rcode(rcode) => dns_error_response(request, rcode),
              }}
          }}

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          enum FilterDecision {{
              Allow,
              Rcode(u8),
          }}

          fn filter_decision(reply: &Value) -> FilterDecision {{
              if let Some(rcode) = reply
                  .get("rcode")
                  .and_then(Value::as_u64)
                  .and_then(|value| u8::try_from(value).ok())
              {{
                  if rcode != 0 {{
                      return FilterDecision::Rcode(rcode.min(15));
                  }}
              }}
              for field in ["refuse", "deny", "drop", "reject"] {{
                  if reply.get(field).and_then(Value::as_bool) == Some(true) {{
                      return FilterDecision::Rcode(5);
                  }}
              }}
              for field in ["allow", "accept", "permitted"] {{
                  if reply.get(field).and_then(Value::as_bool) == Some(false) {{
                      return FilterDecision::Rcode(5);
                  }}
              }}
              for field in ["result", "action", "decision"] {{
                  if let Some(value) = reply.get(field).and_then(Value::as_str) {{
                      if matches!(
                          value.to_ascii_lowercase().as_str(),
                          "refuse" | "refused" | "deny" | "denied" | "drop" | "reject"
                      ) {{
                          return FilterDecision::Rcode(5);
                      }}
                  }}
              }}
              FilterDecision::Allow
          }}

          fn dns_error_response(request: &[u8], rcode: u8) -> Option<Vec<u8>> {{
              if request.len() < 12 {{
                  return None;
              }}
              let mut response = request.to_vec();
              response[2] = (response[2] & 0x79) | 0x80;
              response[3] = (response[3] & 0x10) | 0x80 | (rcode & 0x0f);
              response[6..12].fill(0);
              Some(response)
          }}

          fn base64(input: &[u8]) -> String {{
              const TABLE: &[u8; 64] =
                  b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
              let mut output = String::with_capacity(input.len().div_ceil(3) * 4);
              for chunk in input.chunks(3) {{
                  let first = chunk[0];
                  let second = chunk.get(1).copied().unwrap_or(0);
                  let third = chunk.get(2).copied().unwrap_or(0);
                  output.push(char::from(TABLE[usize::from(first >> 2)]));
                  output.push(char::from(TABLE[usize::from(
                      ((first & 0x03) << 4) | (second >> 4),
                  )]));
                  if chunk.len() > 1 {{
                      output.push(char::from(TABLE[usize::from(
                          ((second & 0x0f) << 2) | (third >> 6),
                      )]));
                  }} else {{
                      output.push('=');
                  }}
                  if chunk.len() > 2 {{
                      output.push(char::from(TABLE[usize::from(third & 0x3f)]));
                  }} else {{
                      output.push('=');
                  }}
              }}
              output
          }}

          pub(crate) fn pinned_input_fields() -> &'static [&'static str] {{
              QUERY_FILTER_INPUT_FIELDS
          }}

          pub(crate) fn pinned_output_fields() -> &'static [&'static str] {{
              QUERY_FILTER_OUTPUT_FIELDS
          }}

          #[cfg(test)]
          mod tests {{
              use super::*;

              fn query() -> Vec<u8> {{
                  vec![
                      0x12, 0x34, 0x01, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00,
                      0x00, 0x07, b'e', b'x', b'a', b'm', b'p', b'l', b'e', 0x03, b'c', b'o',
                      b'm', 0x00, 0x00, 0x01, 0x00, 0x01,
                  ]
              }}

              #[test]
              fn reject_decisions_generate_refused_dns_response() {{
                  let response = apply_filter_reply(
                      &query(),
                      &Value::object([("allow", Value::Bool(false))]),
                  )
                  .expect("REFUSED response");
                  assert_eq!(response[0..2], [0x12, 0x34]);
                  assert_eq!(response[3] & 0x0f, 5);
                  assert_eq!(&response[6..12], &[0; 6]);
              }}

              #[test]
              fn neutral_reply_allows_the_query() {{
                  assert_eq!(
                      filter_decision(&Value::object([("allow", Value::Bool(true))])),
                      FilterDecision::Allow
                  );
              }}

              #[test]
              fn generated_contract_matches_pinned_analysis() {{
                  assert!(!pinned_input_fields().is_empty());
                  assert!(!pinned_output_fields().is_empty());
              }}
          }}
          '''
          Path("src/query_filter.rs").write_text(source, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          declared = False
          for path in [Path("src/lib.rs"), Path("src/landing_glue.rs")]:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              if re.search(r"(?m)^(?:pub\(crate\)\s+)?mod query_filter;\s*$", text):
                  declared = True
                  break
              modules = list(re.finditer(r"(?m)^(?:pub(?:\([^)]*\))?\s+)?mod\s+[A-Za-z0-9_]+;\s*$", text))
              if modules:
                  position = modules[-1].end()
                  text = text[:position] + "\npub(crate) mod query_filter;" + text[position:]
                  path.write_text(text, encoding="utf-8")
                  declared = True
                  break
          if not declared:
              raise SystemExit("cannot declare query_filter module")

          path = Path("src/resolver_methods_01.rs")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"let monitor_request = (?P<request>[A-Za-z_][A-Za-z0-9_]*)\.to_vec\(\);\s*"
              r"let result = self\.resolve_packet_inner\((?P<arguments>.*?)\);\s*"
              r"self\.record_monitor_query_event\(&monitor_request, &result\);",
              re.S,
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit("resolve_packet monitoring wrapper is missing")
          arguments = match.group("arguments")
          replacement = f'''let monitor_request = {match.group("request")}.to_vec();
                  let result = match crate::query_filter::filter_response(&monitor_request) {{
                      Some(response) => Ok(response),
                      None => self.resolve_packet_inner({arguments}),
                  }};
                  self.record_monitor_query_event(&monitor_request, &result);'''
          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/pinned_query_filter_client.rs <<'EOF'
          // SPDX-License-Identifier: LGPL-2.1-or-later
          const FILTER: &str = include_str!("../src/query_filter.rs");
          const RESOLVER: &str = include_str!("../src/resolver_methods_01.rs");

          #[test]
          fn query_filter_remains_a_pre_resolution_client_callback() {
              for symbol in [
                  "io.systemd.Resolve.QueryFilter",
                  "SYSTEMD_RESOLVED_QUERY_FILTER_SOCKET",
                  "query_filter_call",
                  "filter_decision",
                  "dns_error_response",
                  "crate::query_filter::filter_response",
                  "resolve_packet_inner",
              ] {
                  assert!(
                      FILTER.contains(symbol) || RESOLVER.contains(symbol),
                      "missing query-filter client symbol {symbol}"
                  );
              }
          }
          EOF

          rm -f .github/workflows/integrate-query-filter-client.yml
          cargo fmt --all
          git diff --check

      - name: Verify native and package contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss

      - name: Verify Rust implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked

      - name: Verify live contracts and surface reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/live-dns.py target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          python3 scripts/audit-upstream-resolver-surfaces.py --output /tmp/upstream-surface-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/upstream-surface-audit.json").read_text(encoding="utf-8"))
          if "QueryFilter" in report["missing"]["varlink_methods"]:
              raise SystemExit("QueryFilter remains missing")
          PY

      - name: Commit verified QueryFilter client
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Apply pinned QueryFilter callbacks before resolution'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Pinned QueryFilter client parity passed' || 'Pinned QueryFilter client parity failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/query-filter-client","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null