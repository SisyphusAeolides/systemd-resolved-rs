name: Finalize mDNS additional-record semantics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-mdns-additional-records.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize with current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus gfortran iproute2 libssl-dev liburing-dev systemd
      - name: Separate direct answers from related records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/mdns_responder.rs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '''    add_related_records(&mut multicast, &all_records);
    add_related_records(&mut unicast, &all_records);

''',
              '''    let multicast_additional = related_records(&multicast, &all_records);
    let unicast_additional = related_records(&unicast, &all_records);

''',
          )
          text = text.replace(
              '''            &unicast,
            validated.legacy_unicast,
''',
              '''            &unicast,
            &unicast_additional,
            validated.legacy_unicast,
''',
          )
          text = text.replace(
              '''            &multicast,
            false,
''',
              '''            &multicast,
            &multicast_additional,
            false,
''',
          )
          text = text.replace(
              'response_packet(0, &[], &records, false)?',
              'response_packet(0, &[], &records, &BTreeSet::new(), false)?',
          )

          related = r'''fn related_records(
    selected: &BTreeSet<LocalRecord>,
    all_records: &[LocalRecord],
) -> BTreeSet<LocalRecord> {
    let mut output = BTreeSet::new();
    let mut frontier = selected.iter().cloned().collect::<Vec<_>>();
    while let Some(record) = frontier.pop() {
        if record.rr_type == TYPE_PTR {
            for candidate in all_records.iter().filter(|candidate| {
                candidate.owner == record.rdata
                    && matches!(candidate.rr_type, TYPE_PTR | TYPE_SRV | TYPE_TXT)
            }) {
                if !selected.contains(candidate) && output.insert(candidate.clone()) {
                    frontier.push(candidate.clone());
                }
            }
        } else if record.rr_type == TYPE_SRV && record.rdata.len() >= 7 {
            let target = &record.rdata[6..];
            for candidate in all_records.iter().filter(|candidate| {
                candidate.owner == target && matches!(candidate.rr_type, TYPE_A | TYPE_AAAA)
            }) {
                if !selected.contains(candidate) && output.insert(candidate.clone()) {
                    frontier.push(candidate.clone());
                }
            }
        }
    }
    output
}
'''
          text, count = re.subn(
              r'fn add_related_records\(.*?^\}\n',
              related,
              text,
              count=1,
              flags=re.S | re.M,
          )
          if count != 1 and 'fn related_records(' not in text:
              raise SystemExit('cannot locate related-record helper')

          response = r'''fn response_packet(
    identifier: u16,
    questions: &[ParsedQuestion],
    answers: &BTreeSet<LocalRecord>,
    additionals: &BTreeSet<LocalRecord>,
    legacy: bool,
) -> io::Result<Vec<u8>> {
    let question_count = if legacy {
        u16::try_from(questions.len()).map_err(|_| invalid_data("too many DNS questions"))?
    } else {
        0
    };
    let answer_count = u16::try_from(answers.len())
        .map_err(|_| invalid_data("too many mDNS answers"))?;
    let additional_count = u16::try_from(additionals.len())
        .map_err(|_| invalid_data("too many mDNS additional records"))?;
    let response_identifier = if legacy { identifier } else { 0 };
    let mut output = dns_header(
        response_identifier,
        DNS_FLAG_QR | DNS_FLAG_AA,
        question_count,
        answer_count,
        0,
        additional_count,
    );
    if legacy {
        for question in questions {
            output.extend_from_slice(&question.owner);
            output.extend_from_slice(&question.rr_type.to_be_bytes());
            output.extend_from_slice(&question.class.to_be_bytes());
        }
    }
    for record in answers.iter().chain(additionals) {
        append_record(
            &mut output,
            record,
            !legacy,
            legacy.then_some(record.ttl.min(LEGACY_UNICAST_TTL_MAX)),
        )?;
    }
    if output.len() > usize::from(u16::MAX) {
        return Err(invalid_data("mDNS response exceeds the DNS message limit"));
    }
    Ok(output)
}

fn dns_header'''
          text, count = re.subn(
              r'fn response_packet\(.*?^\}\n\nfn dns_header',
              response,
              text,
              count=1,
              flags=re.S | re.M,
          )
          if count != 1:
              raise SystemExit('cannot locate mDNS response packet encoder')
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Verify section semantics and all live paths
        shell: bash
        run: |
          set -euo pipefail
          make check-native
          make check-packaging
          make check-nss
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo build --release --all-features --locked
          python3 tests/live-dnssd.py target/release/systemd-resolved
          python3 tests/live-mdns-responder.py target/release/systemd-resolved
          python3 tests/live-mdns.py target/release/systemd-resolved
          python3 tests/live-dns.py \
            target/release/systemd-resolved target/release/resolvectl
          bash tests/dbus-introspection.sh target/release/systemd-resolved
          git diff --check
      - name: Commit verified response semantics
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-mdns-additional-records.yml
          git add -A
          git diff --cached --check
          git commit -m 'Separate mDNS answers from related additional records'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
