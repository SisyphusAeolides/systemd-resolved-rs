name: Build and test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.74.0
          - stable

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native compiler
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gfortran >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gfortran
          fi

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt,clippy
          rustup default "${{ matrix.toolchain }}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Check native ABI
        run: make check-native

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binaries
        run: cargo build --release --all-features --locked
