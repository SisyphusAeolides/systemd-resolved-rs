name: Finalize portable switch runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-portable-switch-runtime.yml

permissions:
  contents: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out and synchronize source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize with current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Retain and package verifier tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          switch_path = Path('scripts/switch-resolved-transactionally.sh')
          switch = switch_path.read_text(encoding='utf-8')
          if 'SYSTEM_VERIFIER=' not in switch:
              switch = switch.replace(
                  'SYSTEM_COPY=/usr/lib/systemd/systemd-resolved-rs-switch\n',
                  'SYSTEM_COPY=/usr/lib/systemd/systemd-resolved-rs-switch\n'
                  'SYSTEM_VERIFIER=/usr/lib/systemd/systemd-resolved-rs-verify-bundle\n',
                  1,
              )
          old = '''BUNDLE_VERIFIER="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/verify-readiness-bundle.py"
[[ -x $BUNDLE_VERIFIER ]] || {
    printf 'The portable readiness-bundle verifier is missing: %s\\n' "$BUNDLE_VERIFIER" >&2
    exit 2
}
'''
          new = '''BUNDLE_VERIFIER="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/verify-readiness-bundle.py"
if [[ ! -x $BUNDLE_VERIFIER && -x $SYSTEM_VERIFIER ]]; then
    BUNDLE_VERIFIER=$SYSTEM_VERIFIER
fi
[[ -x $BUNDLE_VERIFIER ]] || {
    printf 'The portable readiness-bundle verifier is missing: %s\\n' "$BUNDLE_VERIFIER" >&2
    exit 2
}
'''
          if old in switch:
              switch = switch.replace(old, new, 1)
          elif 'BUNDLE_VERIFIER=$SYSTEM_VERIFIER' not in switch:
              raise SystemExit('cannot locate portable verifier selection')
          install_anchor = 'install -m 0755 "$0" "$SYSTEM_COPY"\n'
          verifier_install = 'install -m 0755 "$BUNDLE_VERIFIER" "$SYSTEM_VERIFIER"\n'
          if verifier_install not in switch:
              if install_anchor not in switch:
                  raise SystemExit('cannot locate switch runtime installation')
              switch = switch.replace(
                  install_anchor,
                  install_anchor + verifier_install,
                  1,
              )
          switch_path.write_text(switch, encoding='utf-8')

          builder_path = Path('scripts/build-reproducible-release.sh')
          builder = builder_path.read_text(encoding='utf-8')
          old_loop = '''    for script in install-replace.sh uninstall-restore.sh boot-smoke.sh preflight-replacement.sh; do
'''
          new_loop = '''    for script in \\
        install-replace.sh \\
        uninstall-restore.sh \\
        boot-smoke.sh \\
        preflight-replacement.sh \\
        certify-replacement.sh \\
        switch-resolved-transactionally.sh \\
        verify-readiness-bundle.py \\
        import-replacement-proof.py \\
        validate-replacement-proof.py; do
'''
          if old_loop in builder:
              builder = builder.replace(old_loop, new_loop, 1)
          elif 'verify-readiness-bundle.py' not in builder:
              raise SystemExit('cannot locate reproducible package script list')
          builder_path.write_text(builder, encoding='utf-8')
          PY
          chmod 0755 \
            scripts/switch-resolved-transactionally.sh \
            scripts/verify-readiness-bundle.py \
            scripts/import-replacement-proof.py \
            scripts/validate-replacement-proof.py
      - name: Validate packaged switch runtime
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            scripts/switch-resolved-transactionally.sh \
            scripts/build-reproducible-release.sh
          python3 -m py_compile \
            scripts/verify-readiness-bundle.py \
            scripts/import-replacement-proof.py \
            scripts/validate-replacement-proof.py
          shellcheck --severity=error scripts/switch-resolved-transactionally.sh
          grep -Fq 'SYSTEM_VERIFIER=' scripts/switch-resolved-transactionally.sh
          grep -Fq 'verify-readiness-bundle.py' scripts/build-reproducible-release.sh
          git diff --check
      - name: Commit portable switch runtime
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm --force .github/workflows/finalize-portable-switch-runtime.yml
          git add -A
          git diff --cached --check
          git commit -m 'Package and retain portable replacement verification tools'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
