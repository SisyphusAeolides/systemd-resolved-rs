name: Analyze pinned DNS-SD conflict contract

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/analyze-dnssd-conflicted-contract.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: resolved-parity-integration
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/dnssd-conflicted-analysis","description":"Pinned DNS-SD conflict analysis in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f compat/current-parity-status.json

      - name: Clone pinned systemd source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(cat compat/upstream-systemd/commit)
          git clone --filter=blob:none --no-checkout https://github.com/systemd/systemd.git /tmp/systemd
          git -C /tmp/systemd fetch --depth 1 origin "$commit"
          git -C /tmp/systemd checkout --detach "$commit"
          test "$(git -C /tmp/systemd rev-parse HEAD)" = "$commit"

      - name: Extract signal schema and emission sites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re
          import subprocess

          root = Path("/tmp/systemd")
          source = root / "src" / "resolve" / "resolved-dnssd-bus.c"
          text = source.read_text(encoding="utf-8", errors="replace")
          definition_match = re.search(
              r"SD_BUS_SIGNAL(?:_[A-Z_]+)?\(\s*\"Conflicted\"(?P<body>.*?)\),",
              text,
              re.S,
          )
          if definition_match is None:
              raise SystemExit("pinned DnssdService.Conflicted signal definition is missing")

          references = []
          emit_sites = []
          conflict_state_sites = []
          for path in sorted((root / "src" / "resolve").rglob("*.[ch]")):
              source_text = path.read_text(encoding="utf-8", errors="replace")
              if "conflict" not in source_text.lower() and "Conflicted" not in source_text:
                  continue
              lines = source_text.splitlines()
              for index, line in enumerate(lines):
                  if "conflict" not in line.lower() and "Conflicted" not in line:
                      continue
                  start = max(0, index - 6)
                  end = min(len(lines), index + 8)
                  excerpt = "\n".join(lines[start:end])
                  item = {
                      "path": path.relative_to(root).as_posix(),
                      "line": index + 1,
                      "excerpt": excerpt,
                  }
                  references.append(item)
                  lowered = excerpt.lower()
                  if "emit_signal" in lowered or "emit_properties_changed" in lowered or "conflicted" in excerpt:
                      emit_sites.append(item)
                  if any(
                      token in lowered
                      for token in (
                          "conflict =",
                          "conflicted =",
                          "state_conflict",
                          "dnssd_service_conflict",
                          "rr_conflict",
                      )
                  ):
                      conflict_state_sites.append(item)

          if not emit_sites:
              raise SystemExit("pinned DNS-SD conflict emission site is missing")

          report = {
              "schema": 1,
              "upstream_commit": subprocess.check_output(
                  ["git", "-C", str(root), "rev-parse", "HEAD"], text=True
              ).strip(),
              "signal": {
                  "interface": "org.freedesktop.resolve1.DnssdService",
                  "name": "Conflicted",
                  "definition_path": source.relative_to(root).as_posix(),
                  "definition": definition_match.group(0),
              },
              "emit_sites": emit_sites,
              "conflict_state_sites": conflict_state_sites,
              "references": references,
          }
          Path("compat/dnssd-conflicted-upstream.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          status_path = Path("compat/current-parity-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          status["dnssd_conflicted_contract"] = {
              "interface": report["signal"]["interface"],
              "signal": report["signal"]["name"],
              "emit_site_count": len(emit_sites),
              "conflict_state_site_count": len(conflict_state_sites),
          }
          status_path.write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm -f .github/workflows/analyze-dnssd-conflicted-contract.yml
          git diff --check

      - name: Commit pinned conflict analysis
        shell: bash
        env:
          GIT_AUTHOR_NAME: SisyphusAeolides
          GIT_AUTHOR_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
          GIT_COMMITTER_NAME: SisyphusAeolides
          GIT_COMMITTER_EMAIL: 37166405+SisyphusAeolides@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'Record pinned DNS-SD conflict contract'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Pinned DNS-SD conflict analysis passed' || 'Pinned DNS-SD conflict analysis failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"parity/dnssd-conflicted-analysis","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null