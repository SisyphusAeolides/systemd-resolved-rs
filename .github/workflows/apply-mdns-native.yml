name: Apply native mDNS transport

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-mdns-native.yml

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"pending","context":"parity/mdns-native","description":"Native mDNS verification in progress","target_url":"%s"}' "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gfortran libssl-dev liburing-dev openssl python3 systemd

      - name: Apply native mDNS transport
        shell: bash
        env:
          MDNS_NATIVE_PATCH_GZ_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$MDNS_NATIVE_PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/mdns-native.patch
          echo 'f83ace1900a29de237f75c1e1afb3d5ce42181d8613d0198d6445de52328e03f  /tmp/mdns-native.patch' | sha256sum --check
          git apply --check /tmp/mdns-native.patch
          git apply /tmp/mdns-native.patch

      - name: Verify stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          cargo +stable fmt --all
          make check-native
          make check-packaging
          make check-nss
          cargo +stable clippy --all-targets --all-features --locked -- -D warnings
          cargo +stable test --all-targets --all-features --locked
          git diff --check

      - name: Verify Rust 1.74
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.74.0 --profile minimal --component rustfmt,clippy
          cargo +1.74.0 fmt --all -- --check
          cargo +1.74.0 clippy --all-targets --all-features --locked -- -D warnings
          cargo +1.74.0 test --all-targets --all-features --locked

      - name: Commit native mDNS transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-mdns-native.yml
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Add native mDNS transport and address snapshots"
          git push origin HEAD:main

      - name: Publish final status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: parity/mdns-native
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Native mDNS verification passed' || 'Native mDNS verification failed' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload=$(printf '{"state":"%s","context":"%s","description":"%s","target_url":"%s"}' "$STATUS_STATE" "$STATUS_CONTEXT" "$STATUS_DESCRIPTION" "$STATUS_URL")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
