[package]
name = "systemd-resolved-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "LGPL-2.1-or-later"
description = "A compatibility-oriented reimplementation of systemd-resolved"
repository = "https://github.com/SisyphusAeolides/systemd-resolved-rs"
build = "build.rs"

[lib]
name = "resolved"
path = "src/lib.rs"

[[bin]]
name = "systemd-resolved"
path = "src/main.rs"

[[bin]]
name = "resolvectl"
path = "src/bin/resolvectl.rs"

[dependencies]
anyhow = "1"
async-trait = { version = "0.1", optional = true }
bincode = "1"
bytes = "1"
crossbeam-queue = "0.3.13"
memmap2 = "0.9"
parking_lot = "0.12"
rand = "0.9.5"
sd-notify = "0.4"
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.5", features = ["all"] }
seahash = "4.1.0"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.19", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "=3.15.2"
idna = { version = "1", optional = true }

[features]
default = ["fortran-routing", "hyper", "supremacy"]
fortran-routing = []
hyper = ["dep:async-trait", "dep:tokio-util"]
beast-wire = []
kalman = []
formal-crosscheck = []
mmap-nss = []
dataplane = []
swr = []
nsec-agg = []
sigcache = []
doq = []
obs = []
supremacy = ["mmap-nss", "dataplane", "swr", "nsec-agg", "sigcache", "doq", "obs"]
idna-name = ["dep:idna"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
zbus_macros = { path = "vendor/zbus_macros" }

[dev-dependencies]
tempfile = "=3.10.1"
